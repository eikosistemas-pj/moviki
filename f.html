<script>
/* MOVIKI f.html | versao 2026-10-01-linkfundador | sem Google Analytics de proposito (redireciona na hora; a /fundador mede a visita ja carimbada) */
(function(){
  var m=location.pathname.match(/\/(fc|f)\/([^\/?#]+)/);
  var tipo=(m&&m[1]==='fc')?'criador':'parceiro';
  var ref=(m?decodeURIComponent(m[2]):'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);
  var canal='indicacao';
  try{
    var cv=(new URLSearchParams(location.search).get('canal')||'').toLowerCase();
    if(/^(ig|tt|yt|wa|qr|bio|story|dm|grupo)$/.test(cv)) canal=cv;
  }catch(e){}
  var q='utm_source='+tipo+'&utm_medium='+canal+'&utm_campaign=lote_fundador'
      +'&utm_content='+encodeURIComponent(ref.length>=3?ref:'sem_ref');
  if(ref.length>=3){
    q+='&ref='+encodeURIComponent(ref);
    try{ document.cookie='mv_ref='+encodeURIComponent(ref)+
      '; Max-Age=7776000; Path=/; Domain=.moviki.com.br; SameSite=Lax; Secure'; }catch(e){}
  }
  location.replace('/fundador?'+q);
})();
</script>
