<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com https://firebasestorage.googleapis.com https://*.firebasestorage.app; connect-src 'self' https://*.googleapis.com; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moviki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--ciano:#00D4FF;--azul:#0066FF;--escuro:#0A1524;--claro:#F2F5F9;--card:#12253d;--borda:#1c3457;--muted:#8fa6c4;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
  html,body{height:100%;}
  body{background:#060f1c;color:var(--claro);}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--escuro);position:relative;overflow:hidden;}
  /* Cabeçalho */
  .hd{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px 8px;flex-shrink:0;}
  .hd .logoTopo{width:auto;max-width:158px;height:auto;display:block;}
  .hd .slogan{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:5px;}
  .hd .slogan b{color:var(--ciano);font-weight:600;}
  .hd .lg{display:flex;align-items:center;gap:7px;}
  .hd .lg svg{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(0,212,255,.6));}
  .hd .lg span{font-size:19px;font-weight:700;letter-spacing:-.5px;}
  .hd .lg b{color:var(--ciano);}
  .iconBtn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;border-radius:9px;}
  .iconBtn:hover{color:var(--ciano);}
  .iconBtn svg{width:21px;height:21px;}
  /* Hero */
  .hero{padding:0 16px 8px;flex-shrink:0;}
  .hero .nm{font-size:19px;font-weight:600;line-height:1.15;}
  .hero .rw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .pill.aberto{background:rgba(46,204,113,.16);color:#57e39a;border:1px solid rgba(46,204,113,.4);}
  .pill.fechado{background:rgba(255,120,120,.16);color:#ff9a9a;border:1px solid rgba(255,120,120,.4);}
  .pill.dist{background:rgba(0,212,255,.12);color:var(--ciano);border:1px solid rgba(0,212,255,.3);}
  .pill .bol{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .recado{margin-top:9px;background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.25);border-radius:11px;padding:9px 12px;font-size:13.5px;line-height:1.4;}
  .recado span{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
  /* Palco central (telinha que troca) */
  .stage{position:relative;flex:1;min-height:220px;margin:8px 12px 0;border-radius:16px;overflow:hidden;border:1px solid var(--borda);background:#0b1a2e;box-shadow:0 0 30px rgba(0,102,255,.12) inset;}
  .pane{position:absolute;inset:0;display:none;}
  .pane.on{display:block;}
  .pane.scroll{overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--ciano) rgba(10,22,34,.6);}
  .pane.scroll::-webkit-scrollbar{width:11px;}
  .pane.scroll::-webkit-scrollbar-track{background:rgba(10,22,34,.55);border-radius:10px;}
  .pane.scroll::-webkit-scrollbar-thumb{background:var(--ciano);border-radius:10px;border:2px solid #0b1a2e;}
  .pane.scroll::-webkit-scrollbar-thumb:hover{background:#3ee0ff;}
  #map{position:absolute;inset:0;background:#0d1c30;}
  .maphint{position:absolute;left:10px;bottom:10px;z-index:600;font-size:10.5px;color:#bcd4ef;background:rgba(10,21,36,.72);padding:4px 9px;border-radius:8px;pointer-events:none;}
  .catTitulo{color:var(--ciano);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
  .catTitulo:first-child{margin-top:0;}
  .itemPub{background:var(--card);border:1px solid var(--borda);border-radius:11px;padding:11px 13px;margin-bottom:8px;}
  .itemTopo{display:flex;align-items:center;gap:10px;}
  .itemPub .nm{flex:1;color:var(--claro);font-size:14.5px;font-weight:500;}
  .itemPub .pr{display:inline-block;background:var(--ciano);color:#04121f;font-size:15.5px;font-weight:800;padding:5px 11px;border-radius:9px;white-space:nowrap;line-height:1;}
  .itemPub.comFoto{padding:0;overflow:hidden;}
  .fotoCapa{width:100%;aspect-ratio:4/3;background:#0a1622;}
  .fotoCapa img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .itemInfo{display:flex;align-items:center;gap:10px;padding:11px 13px;}
  .miniFotos{display:flex;gap:7px;padding:0 13px 12px;}
  .miniFotos img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--borda);cursor:pointer;opacity:.72;transition:opacity .12s,border-color .12s;}
  .miniFotos img:hover{opacity:1;}
  .miniFotos img.ativa{opacity:1;border-color:var(--ciano);box-shadow:0 0 0 2px var(--ciano);}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px;cursor:zoom-out;}
  .lb.on{display:flex;}
  .lb img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 12px 44px rgba(0,0,0,.6);}
  .lb .lbX{position:absolute;top:14px;right:18px;color:#fff;font-size:32px;font-weight:700;line-height:1;background:none;border:none;cursor:pointer;}
  .acabando{background:#ff3b3b;color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.4px;animation:pisca 1s infinite;white-space:nowrap;}
  @keyframes pisca{0%,100%{opacity:1;}50%{opacity:.25;}}
  .promo{background:var(--card);border:1px solid var(--borda);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .promoComCapa{display:flex;flex-direction:row;}
  .promoCapa{width:48%;max-width:180px;aspect-ratio:16/9;background:#0a1622;overflow:hidden;flex-shrink:0;border-radius:12px 0 0 12px;}
  .promoCapa img{width:100%;height:100%;object-fit:cover;display:block;}
  .promoInfo{padding:13px;display:flex;flex-direction:column;justify-content:center;}
  .promoInfo .t{color:var(--claro);font-weight:600;font-size:15px;margin-bottom:3px;}
  .promoInfo .d{color:#a9c0dd;font-size:13px;}
  .evento{background:var(--card);border:1px solid var(--borda);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .eventoComCapa{display:flex;flex-direction:row-reverse;}
  .eventoCapa{width:48%;max-width:180px;aspect-ratio:16/9;background:#0a1622;overflow:hidden;flex-shrink:0;border-radius:0 12px 12px 0;}
  .eventoCapa img{width:100%;height:100%;object-fit:cover;display:block;}
  .eventoInfo{padding:13px;display:flex;flex-direction:column;justify-content:center;}
  .eventoInfo .t{color:var(--claro);font-weight:600;font-size:15px;}
  .eventoInfo .q{color:var(--ciano);font-size:13px;font-weight:600;margin:3px 0;}
  .eventoInfo .d{color:var(--muted);font-size:13px;}
  .promoBox,.eventoBox{background:var(--card);border:1px solid var(--borda);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .midiaCapa{width:100%;aspect-ratio:16/9;background:#0a1622;overflow:hidden;display:block;}
  .midiaCapa img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .midiaInfo{padding:12px 14px;}
  .midiaInfo .t{color:var(--claro);font-weight:600;font-size:15px;margin-bottom:3px;word-break:break-word;}
  .midiaInfo .q{color:var(--ciano);font-size:13px;font-weight:600;margin:3px 0;}
  .midiaInfo .d{color:#a9c0dd;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;}
  .verMidia{display:block;width:100%;background:rgba(0,212,255,.1);border:none;border-top:1px solid var(--borda);color:var(--ciano);padding:11px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .verMidia:hover{background:rgba(0,212,255,.2);}
  .catGrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:2px;}
  .catCard{display:flex;flex-direction:column;border:1px solid var(--ciano);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;background:var(--card);font-family:inherit;text-align:left;}
  .catCardTop{padding:9px 11px 8px;}
  .catCardNome{display:block;color:#fff;font-weight:700;font-size:14px;line-height:1.2;}
  .catCardQtd{display:block;color:#9fb4cc;font-size:11.5px;margin-top:2px;}
  .catCardImg{width:100%;aspect-ratio:1/1;background:#0a1622;}
  .catCardImg img{width:100%;height:100%;object-fit:cover;display:block;}
  .catSemFoto{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#12233a,#0a1622);}
  .voltarCat{background:rgba(255,159,64,.14);border:1px solid rgba(255,159,64,.65);color:#ffca8a;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit;}
  .voltarCat:hover{background:rgba(255,159,64,.24);}
  .vazioMod{color:var(--muted);font-size:14px;text-align:center;padding:24px 10px;}
  /* Botão localização (só na aba mapa) */
  .btnLocal{position:absolute;right:12px;bottom:12px;z-index:600;width:44px;height:44px;border-radius:50%;background:rgba(19,38,61,.96);border:1px solid var(--ciano);color:var(--ciano);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .btnLocal:hover{border-color:var(--ciano);}
  .btnLocal svg{width:22px;height:22px;}
  /* CTA */
  .cta{flex-shrink:0;margin:11px 12px 0;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;font-weight:700;font-size:15px;padding:13px;border-radius:12px;box-shadow:0 8px 22px rgba(0,102,255,.35);}
  .cta svg{width:19px;height:19px;}
  /* Crédito discreto */
  .credit{flex-shrink:0;text-align:center;font-size:10px;color:#54708f;margin:9px 0 8px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px;}
  .credit svg{width:11px;height:11px;opacity:.7;}
  /* Menu inferior */
  .nav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--borda);background:#0c1a2c;}
  .nv{display:flex;flex-direction:column;align-items:center;gap:3px;color:#6f88a8;font-size:10px;cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 6px;}
  .nv svg{width:21px;height:21px;}
  .nv.on{color:var(--ciano);}
  /* Estilo dos controles de zoom do Leaflet */
  .leaflet-control-zoom{border:none!important;box-shadow:0 6px 18px rgba(0,0,0,.4);border-radius:12px!important;overflow:hidden;margin:12px!important;}
  .leaflet-control-zoom a{background:rgba(19,38,61,.96)!important;color:var(--ciano)!important;border-bottom:1px solid var(--borda)!important;width:40px;height:40px;line-height:38px;font-size:20px;font-weight:700;}
  .leaflet-control-zoom a:hover{background:#1b3253!important;}
  .pin{filter:drop-shadow(0 0 6px rgba(0,212,255,.7));}
  .plWrap{position:relative;width:46px;height:46px}
  .plImg{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #00D4FF;background:#0A1524;box-shadow:0 0 6px rgba(0,212,255,.7);display:block}
  .plTip{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #00D4FF}
  /* Tela de estados (carregando / erro / não encontrado) */
  .tela{position:absolute;inset:0;z-index:3000;background:var(--escuro);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px;}
  .tela svg{width:56px;height:56px;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(0,212,255,.5));}
  .tela h1{font-size:20px;font-weight:600;}
  .tela p{color:var(--muted);font-size:14px;max-width:300px;line-height:1.5;}
  .tela a{color:var(--ciano);text-decoration:none;font-weight:600;margin-top:8px;}
  .escondido{display:none !important;}

  .ratingChip{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:13px;color:#cfe0f5;}
  .ratingChip .stars{display:inline-flex;gap:1px;color:#ffc340;}
  .ratingChip .stars svg{width:13px;height:13px;flex-shrink:0;}
  .ratingChip .stars svg.empty{color:#64748b;fill:none;stroke:currentColor;stroke-width:1.5;}
  .ratingChip .stars svg.full{fill:currentColor;stroke:none;}
  .ratingChip b{color:#fff;}
  .acoes{display:flex;gap:8px;margin-top:11px;}
  .acoes button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--borda);color:#cfe0f5;font-family:inherit;font-weight:600;font-size:13px;padding:9px 6px;border-radius:11px;cursor:pointer;}
  .acoes button:hover{border-color:var(--ciano);color:var(--ciano);}
  .acoes button svg{width:15px;height:15px;flex:0 0 auto;}
  .ctaWpp{background:linear-gradient(135deg,#25D366,#128C4B)!important;color:#fff!important;box-shadow:0 8px 22px rgba(37,211,102,.35)!important;}
  .modalAv{position:fixed;inset:0;background:rgba(4,10,20,.72);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .mavBox{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:24px 20px;width:100%;max-width:360px;position:relative;}
  .mavBox h3{font-size:19px;margin-bottom:14px;font-weight:600;}
  .mavX{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  .estrelasPick{display:flex;gap:8px;justify-content:center;font-size:36px;margin:4px 0 18px;}
  .estrelasPick .stp{color:#3a5578;cursor:pointer;transition:.1s;line-height:1;}
  .estrelasPick .stp.on{color:#ffc340;}
  .estrelasPick .stp svg{width:34px;height:34px;fill:currentColor;display:block;}
  .mavBox input,.mavBox textarea{width:100%;background:var(--escuro);border:1px solid var(--borda);border-radius:10px;padding:11px 13px;color:var(--claro);font-family:inherit;font-size:14px;margin-bottom:11px;resize:vertical;}
  .mavEnviar{width:100%;background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;border:none;border-radius:11px;padding:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;}
  .mavAviso{text-align:center;font-size:13px;margin-top:10px;min-height:16px;}
  .heroTop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .heroTop .rw{margin-top:0;flex:0 0 auto;}
  .heroTop .nm{min-width:0;overflow-wrap:anywhere;}
  .mapCtrls{position:absolute;right:10px;top:100px;z-index:600;display:flex;flex-direction:column;gap:10px;}
  .mapBtn{width:44px;height:44px;border-radius:50%;background:rgba(19,38,61,.96);border:1px solid var(--ciano);color:var(--ciano);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:0;}
  .mapBtn:hover{border-color:var(--ciano);}
  .mapBtn svg{width:21px;height:21px;}
  .mapBtn.star svg{color:#ffc340;}
  .ctaRow{display:flex;gap:10px;margin:11px 12px 0;}
  .ctaRow .cta{flex:1;margin:0;min-width:0;}
</style>
</head>

    projectId: "moviki-app",
    storageBucket: "moviki-app.firebasestorage.app",
    messagingSenderId: "451920150738",
    appId: "1:451920150738:web:be458392064c964c792d0b"
  };
  const app=initializeApp(firebaseConfig);
  const db=getFirestore(app);
  const el=id=>document.getElementById(id);
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function mostrarTela(t,x,link){el('telaTitulo').textContent=t;el('telaTexto').innerHTML=x+(link?'<br><a href="https://moviki.com.br">Conhecer o Moviki</a>':'');el('tela').classList.remove('escondido');}
  function esconderTela(){el('tela').classList.add('escondido');}

  /* ---- ícones do menu (SVG inline, sem dependência externa) ---- */
  const IC={
    mapa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
    cardapio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 10v11M17 3c-1.5 0-3 1.8-3 5s1.5 4 3 4v9"/></svg>',
    promocoes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1-.6-1.4V4a1 1 0 0 1 1-1h8a2 2 0 0 1 1.4.6l7.4 7.4a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></svg>',
    eventos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>',
    fotos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 17l5-4 4 3 3-2 6 5"/></svg>'
  };

  /* ---- construtores de conteúdo (com esc() anti-XSS) ---- */
  let cardapioAtual=[], mostrarFotosAtual=false;
  function produtoHtml(p,mostrarFotos){
    const preco=p.preco?('<span class="pr">'+esc(fmtPreco(p.preco))+'</span>'):'';
    const ac=p.acabando?'<span class="acabando">ACABANDO!</span>':'';
    let fotos=[];
    if(mostrarFotos&&Array.isArray(p.fotos))fotos=p.fotos.filter(fotoOk).slice(0,3);
    if(fotos.length){
      const capa='<div class="fotoCapa"><img src="'+esc(fotos[0])+'" alt="'+esc(p.nome||'foto')+'" loading="lazy" decoding="async" onclick="abrirFoto(this.src)"></div>';
      let mini='';
      if(fotos.length>1){ mini='<div class="miniFotos">'+fotos.map((u,idx)=>'<img src="'+esc(u)+'" alt="'+esc(p.nome||'foto')+'" loading="lazy" class="'+(idx===0?'ativa':'')+'" onclick="trocarCapa(this)">').join('')+'</div>'; }
      return '<div class="itemPub comFoto">'+capa+'<div class="itemInfo"><div class="nm">'+esc(p.nome)+'</div>'+ac+preco+'</div>'+mini+'</div>';
    }
    return '<div class="itemPub"><div class="itemTopo"><div class="nm">'+esc(p.nome)+'</div>'+ac+preco+'</div></div>';
  }
  function categoriasValidas(){ return (cardapioAtual||[]).map((c,i)=>({c:c,i:i})).filter(o=>o.c&&(o.c.categoria||(o.c.produtos&&o.c.produtos.length))); }
  function gradeCategorias(){
    const cats=categoriasValidas();
    if(!cats.length)return '<div class="vazioMod">Cardápio em breve.</div>';
    let h='<div class="catGrade">';
    cats.forEach(o=>{
      const c=o.c;
      const n=(c.produtos||[]).filter(x=>x&&x.nome).length;
      const capa=(mostrarFotosAtual&&fotoOk(c.capa))?('<img src="'+esc(c.capa)+'" alt="'+esc(c.categoria||'')+'" loading="lazy" decoding="async">'):'<div class="catSemFoto">🍽</div>';
      h+='<button class="catCard" type="button" onclick="abrirCategoria('+o.i+')"><div class="catCardTop"><span class="catCardNome">'+esc(c.categoria||'Itens')+'</span><span class="catCardQtd">'+n+(n===1?' item':' itens')+'</span></div><div class="catCardImg">'+capa+'</div></button>';
    });
    h+='</div>';
    return h;
  }
  window.abrirCategoria=function(i){
    const c=(cardapioAtual||[])[i]; if(!c)return;
    let h='<button class="voltarCat" type="button" onclick="voltarCategorias()">‹ Categorias</button>';
    h+='<div class="catTitulo">'+esc(c.categoria||'Itens')+'</div>';
    const prods=(c.produtos||[]).filter(x=>x&&x.nome);
    h+=prods.length?prods.map(x=>produtoHtml(x,mostrarFotosAtual)).join(''):'<div class="vazioMod">Sem itens nesta categoria.</div>';
    el('pane-cardapio').innerHTML=h; const pane=el('pane-cardapio'); if(pane)pane.scrollTop=0;
  };
  window.voltarCategorias=function(){ el('pane-cardapio').innerHTML=gradeCategorias(); const pane=el('pane-cardapio'); if(pane)pane.scrollTop=0; };
  function htmlCardapio(cardapio,mostrarFotos){
    cardapioAtual=cardapio||[]; mostrarFotosAtual=!!mostrarFotos;
    return gradeCategorias();
  }
  function htmlPromos(promos){
    let h='';
    promos.forEach(p=>{
      const temCapa=fotoOk(p.capa);
      const info='<div class="midiaInfo"><div class="t">'+esc(p.titulo)+'</div>'+(p.detalhe?'<div class="d">'+esc(p.detalhe)+'</div>':'')+'</div>';
      if(temCapa){
        h+='<div class="promoBox"><div class="midiaCapa"><img src="'+esc(p.capa)+'" alt="'+esc(p.titulo||'promo')+'" loading="lazy" decoding="async" onclick="abrirFoto(this.src)"></div>'+info+'<button class="verMidia" type="button" onclick="verMidia(this)">Ver promoção</button></div>';
      }else{
        h+='<div class="promoBox">'+info+'</div>';
      }
    });
    return h||'<div class="vazioMod">Sem promoções agora.</div>';
  }
  function htmlEventos(evs){
    let h='';
    evs.forEach(e=>{
      const temCapa=fotoOk(e.capa);
      const info='<div class="midiaInfo"><div class="t">'+esc(e.titulo)+'</div>'+(e.quando?'<div class="q">'+esc(e.quando)+'</div>':'')+(e.detalhe?'<div class="d">'+esc(e.detalhe)+'</div>':'')+'</div>';
      if(temCapa){
        h+='<div class="eventoBox"><div class="midiaCapa"><img src="'+esc(e.capa)+'" alt="'+esc(e.titulo||'evento')+'" loading="lazy" decoding="async" onclick="abrirFoto(this.src)"></div>'+info+'<button class="verMidia" type="button" onclick="verMidia(this)">Ver evento</button></div>';
      }else{
        h+='<div class="eventoBox">'+info+'</div>';
      }
    });
    return h||'<div class="vazioMod">Sem eventos agora.</div>';
  }

  /* ---- plano / gating ---- */
  let planoAtual='basico';
  let periodoAtual='';
  function liberaConteudo(){return planoAtual==='pro'||planoAtual==='premium'||planoAtual==='enterprise';}
  async function carregarPlano(uid){
    try{const a=await getDoc(doc(db,'assinaturas',uid));const d=a.exists()?a.data():null;
      const ok=d&&d.ativo===true&&(!d.vence_em||d.vence_em.toMillis()>Date.now());
      planoAtual=ok?(d.plano||'basico'):'basico';
      periodoAtual=ok?(d.periodo||''):'';}
    catch(e){planoAtual='basico';periodoAtual='';}
  }

  /* ---- navegação de tela única (troca a telinha) ---- */
  let abaAtiva='mapa';
  let negocioUid='';
  let notaEscolhida=0;
  window.trocarAba=function(nome){
    abaAtiva=nome;
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
    const alvo=el('pane-'+nome); if(alvo)alvo.classList.add('on');
    document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.aba===nome));
    if(nome==='mapa'&&map){setTimeout(()=>map.invalidateSize(),60);}
  };

  function montarNav(d){
    const cardapio=(d.cardapio||[]).filter(c=>c.produtos&&c.produtos.length);
    const promos=(d.promocoes||[]).filter(p=>p.titulo);
    const eventos=(d.eventos||[]).filter(e=>e.titulo);
    const fotos=(d.fotos||[]).filter(f=>f); // galeria: entra sozinha quando o lojista tiver fotos

    // Mapa sempre disponível
    const abas=[{k:'mapa',lb:'Mapa'}];

    if(liberaConteudo()){
      if(cardapio.length){el('pane-cardapio').innerHTML=htmlCardapio(cardapio,liberaFotos());abas.push({k:'cardapio',lb:'Cardápio'});}
      if(promos.length){el('pane-promocoes').innerHTML=htmlPromos(promos);abas.push({k:'promocoes',lb:'Promoções'});}
      if(eventos.length){el('pane-eventos').innerHTML=htmlEventos(eventos);abas.push({k:'eventos',lb:'Eventos'});}
      // fotos: reservado pra galeria (liga quando houver dados + storage); mantém pane pronto
    }

    const nav=el('nav');nav.innerHTML='';
    abas.forEach(a=>{
      const b=document.createElement('button');
      b.className='nv'+(a.k===abaAtiva?' on':'');
      b.dataset.aba=a.k;
      b.innerHTML=IC[a.k]+'<span>'+a.lb+'</span>';
      b.onclick=()=>window.trocarAba(a.k);
      nav.appendChild(b);
    });
    // se a aba ativa deixou de existir (ex.: plano caiu), volta pro mapa
    if(!abas.some(a=>a.k===abaAtiva))window.trocarAba('mapa');
  }

  /* ---- compartilhar ---- */
  window.compartilhar=async function(){
    const url=window.location.href;
    const titulo=(el('nome').textContent||'Moviki');
    try{ if(navigator.share){await navigator.share({title:titulo,url});return;} }catch(e){return;}
    try{ await navigator.clipboard.writeText(url); const b=el('btnShare'); b.style.color='#57e39a'; setTimeout(()=>b.style.color='',1500); }catch(e){}
  };

  /* ---- avaliações (estrelas públicas) ---- */
  async function carregarAvaliacoesPub(uid){
    const chip=el('ratingChip');if(!chip)return;
    try{
      const qs=await getDocs(collection(db,'negocios',uid,'avaliacoes'));
      let n=0,soma=0;qs.forEach(dd=>{const r=Number(dd.data().nota||0);if(r>=1&&r<=5){n++;soma+=r;}});
      if(n>0){const m=soma/n,c=Math.round(m);
        const estrelaCheia='<svg class="full" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.26-.36L12 2z"/></svg>';
        const estrelaVazia='<svg class="empty" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.26-.36L12 2z"/></svg>';
        let starsHtml='';
        for(let i=1;i<=5;i++) starsHtml+= (i<=c ? estrelaCheia : estrelaVazia);
        chip.innerHTML='<span class="stars">'+starsHtml+'</span> <b>'+m.toFixed(1).replace('.',',')+'</b> · '+n+' avaliação'+(n>1?'ões':'');
        chip.classList.remove('escondido');
      }else{chip.classList.add('escondido');}
    }catch(e){chip.classList.add('escondido');}
  }
  window.abrirAvaliar=function(){el('modalAv').classList.remove('escondido');};
  window.fecharAvaliar=function(){el('modalAv').classList.add('escondido');};
  window.pickNota=function(v){notaEscolhida=v;document.querySelectorAll('#estrelasPick .stp').forEach((sp,i)=>sp.classList.toggle('on',i<v));};
  window.chegar=function(){const b=el('btnRota');if(b&&b.getAttribute('href')&&b.getAttribute('href')!=='#'){b.click();}else{window.trocarAba('mapa');}};
  window.enviarAvaliacao=async function(){
    const av=el('mavAviso');av.style.color='';
    if(!negocioUid){av.textContent='Recarregue a página e tente de novo.';return;}
    if(notaEscolhida<1){av.textContent='Toque nas estrelas pra dar sua nota.';return;}
    let ja=false;try{ja=!!localStorage.getItem('av_'+negocioUid);}catch(_){}
    if(ja){av.style.color='#57e39a';av.textContent='Você já avaliou este negócio. Obrigado!';return;}
    const btn=el('mavEnviar');btn.disabled=true;const t=btn.textContent;btn.textContent='Enviando...';
    try{
      await addDoc(collection(db,'negocios',negocioUid,'avaliacoes'),{nota:notaEscolhida,nome:(el('avNome').value||'').slice(0,40),comentario:(el('avComent').value||'').slice(0,300),criadoEm:serverTimestamp()});
      try{localStorage.setItem('av_'+negocioUid,'1');}catch(_){}
      av.style.color='#57e39a';av.textContent='✅ Obrigado pela sua avaliação!';
      setTimeout(()=>{fecharAvaliar();carregarAvaliacoesPub(negocioUid);},1000);
    }catch(e){av.textContent='Não deu pra enviar agora. Tente mais tarde.';}
    btn.disabled=false;btn.textContent=t;
  };

  /* ---- resolução do link (slug -> uid) ---- */
  const params=new URLSearchParams(window.location.search);
  let slug=decodeURIComponent(window.location.pathname).replace(/^\/+/,'').replace(/\/+$/,'').trim().toLowerCase();
  const idDireto=params.get('id');const lojaQuery=params.get('loja');
  if(lojaQuery)slug=lojaQuery.toLowerCase();

  /* ---- mapa ---- */
  const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([-8.05,-34.9],13);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  const icone=L.divIcon({className:'pin',html:'<svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M32 60s20-18 20-32A20 20 0 1 0 12 28c0 14 20 32 20 32Z" fill="#00D4FF" stroke="#0A1524" stroke-width="2"/><circle cx="32" cy="28" r="7" fill="#0A1524"/></svg>',iconSize:[40,40],iconAnchor:[20,40],popupAnchor:[0,-38]});
  function liberaLogoPino(){return planoAtual==='premium'||planoAtual==='enterprise';}
  function liberaFotos(){return planoAtual==='premium'||planoAtual==='enterprise'||periodoAtual==='trial';}
  function fotoOk(u){return typeof u==='string'&&/^https:\/\/[a-z0-9.-]*(ibb\.co|firebasestorage\.googleapis\.com|firebasestorage\.app)\//i.test(u);}
  function fmtPreco(v){var s=String(v==null?'':v).trim();if(!s)return '';var t=s.replace(/^R\$\s*/i,'').trim();if(/^\d{1,5}([.,]\d{1,2})?$/.test(t)){var n=parseFloat(t.replace(',','.'));if(!isNaN(n))return 'R$ '+n.toFixed(2).replace('.',',');}return 'R$ '+t;}
  window.trocarCapa=function(mini){var card=mini.closest('.comFoto');if(!card)return;var capa=card.querySelector('.fotoCapa img');if(capa)capa.src=mini.src;card.querySelectorAll('.miniFotos img').forEach(function(m){m.classList.toggle('ativa',m===mini);});};
  window.abrirFoto=function(src){var lb=el('lb');if(!lb)return;lb.querySelector('img').src=src;lb.classList.add('on');};
  window.verMidia=function(btn){var box=btn.closest('.promoBox,.eventoBox');if(!box)return;var im=box.querySelector('.midiaCapa img');if(im)abrirFoto(im.src);};
  window.fecharFoto=function(){var lb=el('lb');if(lb)lb.classList.remove('on');};
  function iconePara(d){
    if(liberaLogoPino() && d && d.markerLogo){
      return L.divIcon({className:'pin plPin',html:'<div class="plWrap"><img class="plImg" src="'+d.markerLogo+'" referrerpolicy="no-referrer" alt=""><span class="plTip"></span></div>',iconSize:[46,54],iconAnchor:[23,54],popupAnchor:[0,-50]});
    }
    return icone;
  }
  let marcador=null, viewerMarker=null, negocioPos=null;

  function distanciaKm(a,b){
    const R=6371,rad=x=>x*Math.PI/180;
    const dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]);
    const s=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function mostrarDistancia(p){
    if(!negocioPos)return;
    const km=distanciaKm(p,negocioPos);
    const txt=km<1?Math.round(km*1000)+' m de você':km.toFixed(1).replace('.',',')+' km de você';
    let pill=el('distPill');
    if(!pill){pill=document.createElement('span');pill.id='distPill';pill.className='pill dist';el('statusRow').appendChild(pill);}
    pill.innerHTML='<span class="bol" style="width:0"></span>a '+txt;
  }

  window.localizarme=function(){
    if(!navigator.geolocation){alert('Seu navegador não tem GPS.');return;}
    navigator.geolocation.getCurrentPosition((pos)=>{
      const p=[pos.coords.latitude,pos.coords.longitude];
      if(!viewerMarker){viewerMarker=L.circleMarker(p,{radius:8,color:'#fff',weight:2,fillColor:'#0066FF',fillOpacity:1}).addTo(map).bindPopup('Você está aqui');}else{viewerMarker.setLatLng(p);}
      map.setView(p,16);
      mostrarDistancia(p);
    },(err)=>{alert(err.code===1?'Libere o acesso à sua localização nas permissões do navegador.':'Não consegui pegar sua localização.');},{enableHighAccuracy:true,timeout:10000});
  };

  /* Desenha marca/cardápio (sem mexer na localização) */
  function pintarConteudo(d){
    el('nome').textContent=d.nome||'Negócio';
    const aberto=d.status==='aberto';
    el('statusRow').innerHTML='<span class="pill '+(aberto?'aberto':'fechado')+'"><span class="bol"></span>'+(aberto?'Aberto agora':'Fechado no momento')+'</span>';
    const wpp=(d.whatsapp||'').replace(/\D/g,'');const bw=el('btnWpp');
    if(wpp){bw.href='https://wa.me/55'+wpp;bw.classList.remove('escondido');}else{bw.classList.add('escondido');}
    montarNav(d);
  }
  /* Desenha a localização no mapa */
  function pintarLocal(lat,lng,d){
    esconderTela();
    negocioPos=[lat,lng];
    el('btnRota').href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
    el('btnRota').classList.remove('escondido');
    if(!marcador){marcador=L.marker(negocioPos,{icon:iconePara(d)}).addTo(map);map.setView(negocioPos,16);setTimeout(()=>map.invalidateSize(),80);}else{marcador.setLatLng(negocioPos);marcador.setIcon(iconePara(d));}
    marcador.bindPopup('<b>'+esc(d.nome||'Negócio')+'</b>');
  }
  function semLocal(nome){
    el('btnRota').classList.add('escondido');
    mostrarTela(nome||'Negócio','Este negócio ainda não ligou a localização. Volte daqui a pouco.');
  }

  async function ouvir(uid){
    negocioUid=uid;
    await carregarPlano(uid);
    carregarAvaliacoesPub(uid);
    onSnapshot(doc(db,'negocios',uid),(snap)=>{
      if(!snap.exists()){mostrarTela('Negócio não encontrado','Esse negócio não existe mais.',true);return;}
      const d=snap.data();
      pintarConteudo(d);
      if(typeof d.lat==='number'&&typeof d.lng==='number'){pintarLocal(d.lat,d.lng,d);}
      else{semLocal(d.nome);}
    },()=>{mostrarTela('Erro ao carregar','Tente de novo em instantes.');});
  }

  /* Ponto extra do Enterprise: marca/cardápio/plano/avaliações vêm do DONO;
     a localização vem do PONTO (pontos/pid, ao vivo). */
  async function ouvirPonto(pid,ownerUid){
    negocioUid=ownerUid;
    await carregarPlano(ownerUid);
    carregarAvaliacoesPub(ownerUid);
    onSnapshot(doc(db,'negocios',ownerUid),(snap)=>{
      if(!snap.exists()){mostrarTela('Negócio não encontrado','Esse negócio não existe mais.',true);return;}
      pintarConteudo(snap.data());
    },()=>{});
    onSnapshot(doc(db,'pontos',pid),(snap)=>{
      if(!snap.exists()||snap.data().ativo!==true){semLocal(el('nome').textContent);return;}
      const pt=snap.data();
      if(typeof pt.lat==='number'&&typeof pt.lng==='number'){pintarLocal(pt.lat,pt.lng,{nome:pt.nome||el('nome').textContent,markerLogo:null});}
      else{semLocal(el('nome').textContent);}
    },()=>{mostrarTela('Erro ao carregar','Tente de novo em instantes.');});
  }

  (async()=>{
    if(idDireto){ouvir(idDireto);return;}
    if(!slug){mostrarTela('Bem-vindo ao Moviki','Este link não aponta pra nenhum negócio.',true);return;}
    try{
      const s=await getDoc(doc(db,'slugs',slug));
      if(s.exists()){ouvir(s.data().uid);return;}
      const ps=await getDoc(doc(db,'ponto_slugs',slug));
      if(ps.exists()){const pd=ps.data();ouvirPonto(pd.pid,pd.ownerUid);return;}
      mostrarTela('Negócio não encontrado','Não achamos "'+esc(slug)+'" no Moviki. Confira o link.',true);
    }catch(e){mostrarTela('Erro ao carregar','Tente de novo em instantes.');}
  })();
</script>
<div class="lb" id="lb" onclick="fecharFoto()"><button class="lbX" type="button" onclick="fecharFoto()" aria-label="Fechar">✕</button><img src="" alt="foto ampliada"></div>
</body>
