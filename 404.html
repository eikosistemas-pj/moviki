<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moviki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--ciano:#00D4FF;--azul:#0066FF;--escuro:#0D1B2A;--claro:#F2F5F9;--card:#13263d;--borda:#223a5c;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
  html,body{height:100%;}
  #map{position:absolute;inset:0;z-index:1;background:#0d1c30;}
  .topo{position:absolute;top:0;left:0;right:0;z-index:900;background:linear-gradient(180deg,rgba(13,27,42,.96),rgba(13,27,42,.82) 70%,transparent);padding:14px 16px 26px;display:flex;align-items:center;gap:12px;}
  .topo svg{width:30px;height:30px;flex-shrink:0;}
  .topo .info{flex:1;min-width:0;}
  .topo .nome{color:var(--claro);font-size:18px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;margin-top:4px;}
  .badge.aberto{background:rgba(0,212,255,.18);color:var(--ciano);}
  .badge.fechado{background:rgba(255,120,120,.18);color:#ff9a9a;}
  .badge .bolinha{width:8px;height:8px;border-radius:50%;background:currentColor;}
  /* Barra de ícones à esquerda */
  .toolbar{position:absolute;left:12px;top:88px;z-index:1000;display:flex;flex-direction:column;gap:10px;}
  .toolBtn{width:56px;background:rgba(19,38,61,.94);border:1px solid var(--borda);border-radius:14px;color:var(--claro);cursor:pointer;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:.15s;}
  .toolBtn:hover{border-color:var(--ciano);}
  .toolBtn .ic{font-size:22px;line-height:1;}
  .toolBtn .lb{font-size:9.5px;font-weight:600;color:#c7d6ea;}
  /* Gaveta lateral */
  .drawer{position:absolute;left:0;top:0;bottom:0;width:350px;max-width:86%;z-index:2000;background:var(--escuro);border-right:1px solid var(--borda);box-shadow:14px 0 40px rgba(0,0,0,.5);transform:translateX(-106%);transition:transform .25s ease;overflow-y:auto;padding:18px 18px 30px;}
  .drawer.aberto{transform:translateX(0);}
  .drawerCab{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .drawerCab h2{color:var(--claro);font-size:18px;}
  .fechar{background:none;border:1px solid var(--borda);color:#8fa6c4;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;}
  .catTitulo{color:var(--ciano);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;}
  .itemPub{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--borda);border-radius:11px;padding:11px 13px;margin-bottom:8px;}
  .itemPub .nm{flex:1;color:var(--claro);font-size:14.5px;font-weight:500;}
  .itemPub .pr{color:#8fa6c4;font-size:14px;font-weight:600;white-space:nowrap;}
  .acabando{background:#ff3b3b;color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.4px;animation:pisca 1s infinite;white-space:nowrap;}
  @keyframes pisca{0%,100%{opacity:1;}50%{opacity:.25;}}
  .promo{background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(0,102,255,.12));border:1px solid rgba(0,212,255,.35);border-radius:12px;padding:13px;margin-bottom:10px;}
  .promo .t{color:var(--claro);font-weight:700;font-size:15px;margin-bottom:3px;}
  .promo .d{color:#a9c0dd;font-size:13px;}
  .evento{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:13px;margin-bottom:10px;}
  .evento .t{color:var(--claro);font-weight:700;font-size:15px;}
  .evento .q{color:var(--ciano);font-size:13px;font-weight:600;margin:3px 0;}
  .evento .d{color:#8fa6c4;font-size:13px;}
  /* rodapé */
  .rodape{position:absolute;left:12px;right:12px;bottom:14px;z-index:900;background:rgba(19,38,61,.96);border:1px solid var(--borda);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);}
  .rodape .recado{color:var(--claro);font-size:14px;line-height:1.4;margin-bottom:12px;}
  .rodape .recado span{color:#8fa6c4;font-size:12px;display:block;margin-bottom:2px;}
  .btnRota{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;font-weight:700;font-size:15px;padding:13px;border-radius:11px;}
  .tela{position:absolute;inset:0;z-index:3000;background:var(--escuro);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--claro);gap:10px;}
  .tela svg{width:56px;height:56px;margin-bottom:6px;}
  .tela h1{font-size:20px;font-weight:700;}
  .tela p{color:#8fa6c4;font-size:14px;max-width:300px;line-height:1.5;}
  .tela a{color:var(--ciano);text-decoration:none;font-weight:600;margin-top:8px;}
  .vazioMod{color:#8fa6c4;font-size:14px;text-align:center;padding:20px;}
  .escondido{display:none !important;}
  .pin{filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));}
  .btnLocal{position:absolute;right:16px;bottom:100px;z-index:950;width:46px;height:46px;border-radius:50%;background:rgba(19,38,61,.96);border:1px solid var(--borda);color:var(--ciano);font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .btnLocal:hover{border-color:var(--ciano);}
  .logoMini{height:30px;width:auto;flex-shrink:0;}
  .leaflet-top.leaflet-right{top:70px;}
  .leaflet-control-zoom{border:none!important;box-shadow:0 6px 18px rgba(0,0,0,.4);border-radius:12px!important;overflow:hidden;}
  .leaflet-control-zoom a{background:rgba(19,38,61,.96)!important;color:var(--ciano)!important;border-bottom:1px solid var(--borda)!important;width:44px;height:44px;line-height:42px;font-size:22px;font-weight:700;}
  .leaflet-control-zoom a:hover{background:#1b3253!important;}
  @media(min-width:900px){.rodape{left:auto;right:16px;width:320px;}}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjr0QED8JfHvIb1UtsM0CWHDXmJzDQhWw",
    authDomain: "moviki-app.firebaseapp.com",
    projectId: "moviki-app",
    storageBucket: "moviki-app.firebasestorage.app",
    messagingSenderId: "451920150738",
    appId: "1:451920150738:web:be458392064c964c792d0b"
  };
  const app=initializeApp(firebaseConfig);
  const db=getFirestore(app);
  const el=id=>document.getElementById(id);
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function mostrarTela(t,x,link){el('telaTitulo').textContent=t;el('telaTexto').innerHTML=x+(link?'<br><a href="https://moviki.com.br">Conhecer o Moviki</a>':'');el('tela').classList.remove('escondido');}
  function esconderTela(){el('tela').classList.add('escondido');}

  let moduloAberto=null;
  const modulos={}; // {cardapio:{titulo,html}, promocoes:{...}, eventos:{...}}
  window.fecharDrawer=function(){el('drawer').classList.remove('aberto');moduloAberto=null;};
  window.abrirModulo=function(nome){
    if(!modulos[nome])return;
    moduloAberto=nome;
    el('drawerTitulo').textContent=modulos[nome].titulo;
    el('drawerConteudo').innerHTML=modulos[nome].html;
    el('drawer').classList.add('aberto');
  };

  function htmlCardapio(cardapio){
    let h='';
    cardapio.forEach(cat=>{
      if(!cat.categoria&&!(cat.produtos&&cat.produtos.length))return;
      h+='<div class="catTitulo">'+esc(cat.categoria||'Itens')+'</div>';
      (cat.produtos||[]).forEach(p=>{
        const preco=p.preco?('<span class="pr">'+esc(p.preco)+'</span>'):'';
        const ac=p.acabando?'<span class="acabando">ACABANDO!</span>':'';
        h+='<div class="itemPub"><div class="nm">'+esc(p.nome)+'</div>'+ac+preco+'</div>';
      });
    });
    return h||'<div class="vazioMod">Cardápio em breve.</div>';
  }
  function htmlPromos(promos){
    let h='';
    promos.forEach(p=>{h+='<div class="promo"><div class="t">'+esc(p.titulo)+'</div>'+(p.detalhe?'<div class="d">'+esc(p.detalhe)+'</div>':'')+'</div>';});
    return h||'<div class="vazioMod">Sem promoções agora.</div>';
  }
  function htmlEventos(evs){
    let h='';
    evs.forEach(e=>{h+='<div class="evento"><div class="t">'+esc(e.titulo)+'</div>'+(e.quando?'<div class="q">'+esc(e.quando)+'</div>':'')+(e.detalhe?'<div class="d">'+esc(e.detalhe)+'</div>':'')+'</div>';});
    return h||'<div class="vazioMod">Sem eventos agora.</div>';
  }

  function montarToolbar(d){
    const cardapio=(d.cardapio||[]).filter(c=>c.produtos&&c.produtos.length);
    const promos=(d.promocoes||[]).filter(p=>p.titulo);
    const eventos=(d.eventos||[]).filter(e=>e.titulo);
    // limpa
    for(const k in modulos)delete modulos[k];
    const botoes=[];
    if(cardapio.length){modulos.cardapio={titulo:'🍽️ Cardápio',html:htmlCardapio(cardapio)};botoes.push({m:'cardapio',ic:'🍽️',lb:'Cardápio'});}
    if(promos.length){modulos.promocoes={titulo:'🏷️ Promoções',html:htmlPromos(promos)};botoes.push({m:'promocoes',ic:'🏷️',lb:'Promoções'});}
    if(eventos.length){modulos.eventos={titulo:'📅 Eventos',html:htmlEventos(eventos)};botoes.push({m:'eventos',ic:'📅',lb:'Eventos'});}
    const tb=el('toolbar');
    tb.innerHTML='';
    botoes.forEach(b=>{
      const btn=document.createElement('button');btn.className='toolBtn';
      btn.innerHTML='<span class="ic">'+b.ic+'</span><span class="lb">'+b.lb+'</span>';
      btn.onclick=()=>window.abrirModulo(b.m);
      tb.appendChild(btn);
    });
    tb.classList.toggle('escondido',botoes.length===0);
    // se a gaveta estava aberta, atualiza ou fecha
    if(moduloAberto){ modulos[moduloAberto]?window.abrirModulo(moduloAberto):fecharDrawer(); }
  }

  const params=new URLSearchParams(window.location.search);
  let slug=decodeURIComponent(window.location.pathname).replace(/^\/+/,'').replace(/\/+$/,'').trim().toLowerCase();
  const idDireto=params.get('id');const lojaQuery=params.get('loja');
  if(lojaQuery)slug=lojaQuery.toLowerCase();

  const map=L.map('map',{zoomControl:false}).setView([-8.05,-34.9],13);

  let marcador=null, viewerMarker=null;

  window.localizarme=function(){
    if(!navigator.geolocation){alert('Seu navegador não tem GPS.');return;}
    navigator.geolocation.getCurrentPosition((pos)=>{
      const p=[pos.coords.latitude,pos.coords.longitude];
      if(!viewerMarker){viewerMarker=L.circleMarker(p,{radius:8,color:'#fff',weight:2,fillColor:'#0066FF',fillOpacity:1}).addTo(map).bindPopup('Você está aqui');}else{viewerMarker.setLatLng(p);}
      map.setView(p,16);
    },(err)=>{alert(err.code===1?'Libere o acesso à sua localização nas permissões do navegador.':'Não consegui pegar sua localização.');},{enableHighAccuracy:true,timeout:10000});
  };

  function ouvir(uid){
    onSnapshot(doc(db,'negocios',uid),(snap)=>{
      if(!snap.exists()){mostrarTela('Negócio não encontrado','Esse negócio não existe mais.',true);return;}
      const d=snap.data();
      el('nome').textContent=d.nome||'Negócio';
      const aberto=d.status==='aberto';
      el('statusBadge').innerHTML='<span class="badge '+(aberto?'aberto':'fechado')+'"><span class="bolinha"></span>'+(aberto?'Aberto agora':'Fechado no momento')+'</span>';
      el('topo').classList.remove('escondido');
      if(d.recado&&d.recado.trim()){el('recado').textContent=d.recado;el('recadoBox').classList.remove('escondido');}else{el('recadoBox').classList.add('escondido');}
      montarToolbar(d);
      if(typeof d.lat==='number'&&typeof d.lng==='number'){
        esconderTela();el('rodape').classList.remove('escondido');el('btnLocal').classList.remove('escondido');
        el('btnRota').href='https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lng;
        const pos=[d.lat,d.lng];
        if(!marcador){marcador=L.marker(pos,{icon:icone}).addTo(map);map.setView(pos,16);}else{marcador.setLatLng(pos);}
        marcador.bindPopup('<b>'+esc(d.nome||'Negócio')+'</b>');
      }else{el('rodape').classList.add('escondido');mostrarTela(d.nome||'Negócio','Este negócio ainda não ligou a localização. Volte daqui a pouco.');}
    },()=>{mostrarTela('Erro ao carregar','Tente de novo em instantes.');});
  }

  (async()=>{
    if(idDireto){ouvir(idDireto);return;}
    if(!slug){mostrarTela('Bem-vindo ao Moviki','Este link não aponta pra nenhum negócio.',true);return;}
    try{
      const s=await getDoc(doc(db,'slugs',slug));
      if(!s.exists()){mostrarTela('Negócio não encontrado','Não achamos "'+esc(slug)+'" no Moviki. Confira o link.',true);return;}
      ouvir(s.data().uid);
    }catch(e){mostrarTela('Erro ao carregar','Tente de novo em instantes.');}
  })();
</script>
