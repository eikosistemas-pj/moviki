<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moviki — Painel do Negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ciano:#00D4FF;--azul:#0066FF;--escuro:#0D1B2A;--claro:#F2F5F9;--card:#13263d;--card-borda:#223a5c;--campo:#0d1c30;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%, #163155 0%, var(--escuro) 55%);color:var(--claro);display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{width:100%;max-width:440px;transition:max-width .2s;}
  .box.largo{max-width:660px;}
  .marca{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .marca svg{width:38px;height:38px;}
  .marca .logoMarca{height:44px;width:auto;}
  .marca .nome{font-size:30px;font-weight:700;letter-spacing:-1px;}
  .marca .nome b{color:var(--ciano);}
  .slogan{text-align:center;font-size:12px;color:#8fa6c4;letter-spacing:.5px;text-transform:uppercase;margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--card-borda);border-radius:18px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .abas{display:flex;background:var(--campo);border-radius:12px;padding:4px;margin-bottom:22px;}
  .abas button{flex:1;border:none;background:transparent;color:#8fa6c4;padding:10px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
  .abas button.ativa{background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;}
  label{display:block;font-size:13px;font-weight:500;margin:0 0 6px 2px;color:#c7d6ea;}
  .campo{position:relative;margin-bottom:16px;}
  input,textarea{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--card-borda);background:var(--campo);color:var(--claro);font-size:15px;outline:none;transition:.15s;resize:none;}
  input:focus,textarea:focus{border-color:var(--ciano);box-shadow:0 0 0 3px rgba(0,212,255,.15);}
  .verSenha{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8fa6c4;cursor:pointer;font-size:12px;font-weight:600;}
  .btn{width:100%;padding:14px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;font-size:15px;font-weight:700;letter-spacing:.3px;transition:.15s;}
  .btn:hover{filter:brightness(1.07);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.secundario{background:transparent;border:1px solid var(--card-borda);color:#c7d6ea;}
  .btn.secundario:hover{border-color:var(--ciano);color:var(--ciano);filter:none;}
  .aviso{margin-top:14px;padding:12px;border-radius:10px;font-size:13.5px;display:none;text-align:center;}
  .aviso.erro{display:block;background:rgba(255,80,80,.12);color:#ff9a9a;border:1px solid rgba(255,80,80,.3);}
  .aviso.ok{display:block;background:rgba(0,212,255,.12);color:var(--ciano);border:1px solid rgba(0,212,255,.3);}
  .dica{font-size:12px;color:#7f95b3;text-align:center;margin-top:14px;line-height:1.5;}
  .painel{display:none;}
  .cabPainel{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .cabPainel .ola{font-size:13px;color:#8fa6c4;}
  .cabPainel .ola b{color:var(--claro);display:block;font-size:14px;margin-top:2px;word-break:break-all;}
  .sairMini{background:none;border:1px solid var(--card-borda);color:#8fa6c4;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .sairMini:hover{border-color:#ff8080;color:#ff9a9a;}
  /* Abas do painel */
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .tab{flex:0 0 auto;border:1px solid var(--card-borda);background:var(--campo);color:#8fa6c4;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab.ativa{background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;border-color:transparent;}
  .tabConteudo{margin-bottom:6px;}
  .statusLinha{display:flex;gap:10px;margin-bottom:16px;}
  .statusBtn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--card-borda);background:var(--campo);color:#8fa6c4;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;}
  .statusBtn.aberto{background:rgba(0,212,255,.15);border-color:var(--ciano);color:var(--ciano);}
  .statusBtn.fechado{background:rgba(255,120,120,.14);border-color:#ff8080;color:#ff9a9a;}
  .gps{background:var(--campo);border:1px solid var(--card-borda);border-radius:11px;padding:14px;margin-bottom:16px;font-size:13px;color:#8fa6c4;}
  .gps b{color:var(--claro);}
  .linkCampo{display:flex;align-items:center;border:1px solid var(--card-borda);background:var(--campo);border-radius:11px;overflow:hidden;}
  .linkCampo:focus-within{border-color:var(--ciano);box-shadow:0 0 0 3px rgba(0,212,255,.15);}
  .linkCampo .pref{padding:13px 4px 13px 14px;color:#8fa6c4;font-size:15px;white-space:nowrap;}
  .linkCampo input{border:none;background:transparent;box-shadow:none !important;padding-left:2px;}
  .linkPronto{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.3);border-radius:11px;padding:14px;margin-bottom:16px;}
  .linkPronto .rot{font-size:12px;color:#8fa6c4;margin-bottom:8px;}
  .linkRow{display:flex;gap:8px;align-items:center;}
  .linkRow a{flex:1;color:var(--ciano);font-weight:600;font-size:14px;text-decoration:none;word-break:break-all;}
  .linkRow button{background:linear-gradient(135deg,var(--ciano),var(--azul));color:#04121f;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
  /* Blocos dinâmicos (categorias / produtos / promoções / eventos) */
  .secTitulo{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;}
  .secTitulo label{margin:0;font-size:14px;}
  .addBtn{background:none;border:1px solid var(--ciano);color:var(--ciano);border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .catBloco{background:var(--campo);border:1px solid var(--card-borda);border-radius:12px;padding:12px;margin-bottom:12px;}
  .catCab{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .catCab .cat-nome{font-weight:600;}
  .rmv{background:none;border:none;color:#ff8080;font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1;}
  .prodRow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .prodRow .p-nome{flex:1;padding:10px 12px;font-size:14px;}
  .prodRow .p-preco{width:88px;flex-shrink:0;padding:10px 10px;font-size:14px;}
  .acabLbl{display:flex;align-items:center;gap:5px;font-size:12px;color:#c7d6ea;white-space:nowrap;cursor:pointer;}
  .acabLbl input{width:auto;}
  .addProd{background:none;border:1px dashed var(--card-borda);color:#8fa6c4;border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:4px;}
  .linha2{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .linha2 input{flex:1;}
  .vazioCard{font-size:13px;color:#7f95b3;text-align:center;padding:10px;}
  .escondido{display:none !important;}
</style>
</head>

  <div class="card">

        <div id="linkPronto" class="linkPronto escondido"><div class="rot">✅ Link pra divulgar (bio do Instagram, WhatsApp...):</div><div class="linkRow"><a id="linkPublico" href="#" target="_blank" rel="noopener"></a><button onclick="copiarLink()" id="btnCopiar">Copiar</button></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjr0QED8JfHvIb1UtsM0CWHDXmJzDQhWw",
    authDomain: "moviki-app.firebaseapp.com",
    projectId: "moviki-app",
    storageBucket: "moviki-app.firebasestorage.app",
    messagingSenderId: "451920150738",
    appId: "1:451920150738:web:be458392064c964c792d0b"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const el = id => document.getElementById(id);
  let modo='entrar', usuarioAtual=null, statusAtual='fechado', coords=null, slugSalvo='';
  const RESERVADOS=['index','mapa','404','assets','www','painel','login','moviki'];

  /* ---- ACESSO ---- */
  const aviso=el('aviso');
  function limparAviso(){aviso.className='aviso';aviso.textContent='';}
  function erroAcesso(t){aviso.className='aviso erro';aviso.textContent=t;}
  window.trocarAba=function(n){modo=n;el('abaEntrar').classList.toggle('ativa',n==='entrar');el('abaCriar').classList.toggle('ativa',n==='criar');el('btnAcao').textContent=n==='entrar'?'Entrar':'Criar conta';el('dica').textContent=n==='criar'?'Vai criar uma conta de teste. Use um e-mail seu e uma senha simples.':'';limparAviso();};
  window.verSenha=function(){const s=el('senha'),b=document.querySelector('.verSenha');if(s.type==='password'){s.type='text';b.textContent='ocultar';}else{s.type='password';b.textContent='mostrar';}};
  function msgErro(c){const m={'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite uma senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/email-already-in-use':'Esse e-mail já tem conta. Tente "Entrar".','auth/invalid-credential':'E-mail ou senha incorretos.','auth/user-not-found':'Não encontrei conta com esse e-mail.','auth/wrong-password':'Senha incorreta.','auth/too-many-requests':'Muitas tentativas. Espere um pouco.','auth/network-request-failed':'Sem conexão. Confira a internet.'};return m[c]||('Erro: '+c);}
  window.acao=async function(){const email=el('email').value.trim(),senha=el('senha').value,btn=el('btnAcao');limparAviso();if(!email){erroAcesso('Digite seu e-mail.');return;}if(!senha){erroAcesso('Digite uma senha.');return;}btn.disabled=true;const t=btn.textContent;btn.textContent='Aguarde...';try{if(modo==='criar')await createUserWithEmailAndPassword(auth,email,senha);else await signInWithEmailAndPassword(auth,email,senha);}catch(e){erroAcesso(msgErro(e.code));btn.disabled=false;btn.textContent=t;}};
  window.sair=async function(){await signOut(auth);};

  /* ---- TABS ---- */
  window.abrirTab=function(nome){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('ativa',b.dataset.tab===nome));
    document.querySelectorAll('.tabConteudo').forEach(c=>c.classList.add('escondido'));
    el('tab-'+nome).classList.remove('escondido');
  };

  /* ---- PAINEL util ---- */
  const avisoP=el('avisoP');
  function limparAvisoP(){avisoP.className='aviso';avisoP.textContent='';}
  function okP(t){avisoP.className='aviso ok';avisoP.textContent=t;}
  function erroP(t){avisoP.className='aviso erro';avisoP.textContent=t;}
  window.setStatus=function(s){statusAtual=s;el('btnAberto').className='statusBtn'+(s==='aberto'?' aberto':'');el('btnFechado').className='statusBtn'+(s==='fechado'?' fechado':'');};
  window.pegarLocalizacao=function(){limparAvisoP();if(!navigator.geolocation){erroP('Seu aparelho não tem GPS no navegador.');return;}el('gpsInfo').innerHTML='📍 Pegando localização...';navigator.geolocation.getCurrentPosition((pos)=>{coords={lat:pos.coords.latitude,lng:pos.coords.longitude};el('gpsInfo').innerHTML='📍 <b>Localização capturada!</b><br>'+coords.lat.toFixed(5)+', '+coords.lng.toFixed(5)+' <span style="color:#7f95b3">(lembre de Salvar)</span>';},(err)=>{if(err.code===1)erroP('Você bloqueou a localização. Libere nas permissões do navegador.');else erroP('Não consegui pegar a localização.');el('gpsInfo').innerHTML='📍 Localização ainda não definida.';},{enableHighAccuracy:true,timeout:10000});};

  /* ---- CARDÁPIO (categorias -> produtos) ---- */
  function vazioCat(){el('vazioCat').classList.toggle('escondido',el('listaCategorias').children.length>0);}
  function novaProdRow(catBloco,nome='',preco='',acabando=false){
    const r=document.createElement('div');r.className='prodRow';
    r.innerHTML='<input class="p-nome" type="text" placeholder="Produto"><input class="p-preco" type="text" placeholder="R$"><label class="acabLbl"><input type="checkbox" class="p-acab"> acabando</label><button class="rmv">✕</button>';
    r.querySelector('.p-nome').value=nome;r.querySelector('.p-preco').value=preco;r.querySelector('.p-acab').checked=!!acabando;
    r.querySelector('.rmv').onclick=()=>r.remove();
    catBloco.querySelector('.listaProdutos').appendChild(r);
  }
  window.adicionarCategoria=function(nome='',produtos=[]){
    const b=document.createElement('div');b.className='catBloco';
    b.innerHTML='<div class="catCab"><input class="cat-nome" type="text" placeholder="Nome da categoria (ex.: Caldos)"><button class="rmv" title="Remover categoria">✕</button></div><div class="listaProdutos"></div><button class="addProd">+ Produto</button>';
    b.querySelector('.cat-nome').value=nome;
    b.querySelector('.rmv').onclick=()=>{b.remove();vazioCat();};
    b.querySelector('.addProd').onclick=()=>novaProdRow(b);
    el('listaCategorias').appendChild(b);
    (produtos&&produtos.length?produtos:[{}]).forEach(p=>novaProdRow(b,p.nome||'',p.preco||'',p.acabando));
    vazioCat();
  };
  function lerCardapio(){
    const cats=[];
    el('listaCategorias').querySelectorAll('.catBloco').forEach(b=>{
      const nome=b.querySelector('.cat-nome').value.trim();if(!nome)return;
      const produtos=[];
      b.querySelectorAll('.prodRow').forEach(r=>{const pn=r.querySelector('.p-nome').value.trim();if(!pn)return;produtos.push({nome:pn,preco:r.querySelector('.p-preco').value.trim(),acabando:r.querySelector('.p-acab').checked});});
      cats.push({categoria:nome,produtos});
    });
    return cats;
  }

  /* ---- PROMOÇÕES ---- */
  function vazioPromo(){el('vazioPromo').classList.toggle('escondido',el('listaPromos').children.length>0);}
  window.adicionarPromo=function(titulo='',detalhe=''){
    const r=document.createElement('div');r.className='catBloco';
    r.innerHTML='<div class="linha2"><input class="pr-tit" type="text" placeholder="Título (ex.: Combo 2 por R$20)"><button class="rmv">✕</button></div><input class="pr-det" type="text" placeholder="Detalhe (opcional)">';
    r.querySelector('.pr-tit').value=titulo;r.querySelector('.pr-det').value=detalhe;
    r.querySelector('.rmv').onclick=()=>{r.remove();vazioPromo();};
    el('listaPromos').appendChild(r);vazioPromo();
  };
  function lerPromos(){const a=[];el('listaPromos').querySelectorAll('.catBloco').forEach(r=>{const t=r.querySelector('.pr-tit').value.trim();if(!t)return;a.push({titulo:t,detalhe:r.querySelector('.pr-det').value.trim()});});return a;}

  /* ---- EVENTOS ---- */
  function vazioEvento(){el('vazioEvento').classList.toggle('escondido',el('listaEventos').children.length>0);}
  window.adicionarEvento=function(titulo='',quando='',detalhe=''){
    const r=document.createElement('div');r.className='catBloco';
    r.innerHTML='<div class="linha2"><input class="ev-tit" type="text" placeholder="Nome do evento"><button class="rmv">✕</button></div><input class="ev-quando" type="text" placeholder="Quando (ex.: Sáb 26/07 às 18h)" style="margin-bottom:8px"><input class="ev-det" type="text" placeholder="Local / detalhe (opcional)">';
    r.querySelector('.ev-tit').value=titulo;r.querySelector('.ev-quando').value=quando;r.querySelector('.ev-det').value=detalhe;
    r.querySelector('.rmv').onclick=()=>{r.remove();vazioEvento();};
    el('listaEventos').appendChild(r);vazioEvento();
  };
  function lerEventos(){const a=[];el('listaEventos').querySelectorAll('.catBloco').forEach(r=>{const t=r.querySelector('.ev-tit').value.trim();if(!t)return;a.push({titulo:t,quando:r.querySelector('.ev-quando').value.trim(),detalhe:r.querySelector('.ev-det').value.trim()});});return a;}

  /* ---- LINK ---- */
  function limpaSlug(v){return (v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');}
  function mostrarLink(slug){slugSalvo=slug;el('linkPublico').textContent='moviki.com.br/'+slug;el('linkPublico').href='https://moviki.com.br/'+slug;el('linkPronto').classList.remove('escondido');}
  window.copiarLink=function(){if(!slugSalvo)return;navigator.clipboard.writeText('https://moviki.com.br/'+slugSalvo).then(()=>{const b=el('btnCopiar');b.textContent='Copiado!';setTimeout(()=>b.textContent='Copiar',1500);});};

  /* ---- SALVAR ---- */
  window.salvar=async function(){
    if(!usuarioAtual)return;
    const btn=el('btnSalvar');limparAvisoP();
    const nome=el('nome').value.trim();
    if(!nome){abrirTab('perfil');erroP('Dê um nome ao seu negócio (aba Perfil).');return;}
    const apelidoDigitado=el('apelido').value.trim();
    let slug='';
    if(apelidoDigitado){slug=limpaSlug(apelidoDigitado);if(slug.length<3){abrirTab('perfil');erroP('O apelido precisa ter ao menos 3 letras/números (sem espaços ou acentos).');return;}if(RESERVADOS.includes(slug)){abrirTab('perfil');erroP('Esse apelido é reservado, escolha outro.');return;}}
    btn.disabled=true;const t=btn.textContent;btn.textContent='Salvando...';
    try{
      if(slug){const ref=doc(db,'slugs',slug);const snap=await getDoc(ref);if(snap.exists()&&snap.data().uid!==usuarioAtual.uid){abrirTab('perfil');erroP('O apelido "'+slug+'" já está em uso. Escolha outro.');btn.disabled=false;btn.textContent=t;return;}if(!snap.exists()){await setDoc(ref,{uid:usuarioAtual.uid});}el('apelido').value=slug;}
      const dados={nome,status:statusAtual,recado:el('recado').value.trim(),cardapio:lerCardapio(),promocoes:lerPromos(),eventos:lerEventos(),atualizadoEm:serverTimestamp()};
      if(coords){dados.lat=coords.lat;dados.lng=coords.lng;}
      if(slug){dados.slug=slug;}
      await setDoc(doc(db,'negocios',usuarioAtual.uid),dados,{merge:true});
      okP('✅ Tudo salvo!');
      if(slug) mostrarLink(slug);
    }catch(e){erroP('Não consegui salvar: '+(e.code||e.message));}
    btn.disabled=false;btn.textContent=t;
  };

  async function carregarDados(uid){
    try{
      const snap=await getDoc(doc(db,'negocios',uid));
      if(snap.exists()){
        const d=snap.data();
        el('nome').value=d.nome||'';el('recado').value=d.recado||'';el('apelido').value=d.slug||'';
        setStatus(d.status||'fechado');
        if(d.slug) mostrarLink(d.slug);
        el('listaCategorias').innerHTML='';(d.cardapio||[]).forEach(c=>adicionarCategoria(c.categoria||'',c.produtos||[]));vazioCat();
        el('listaPromos').innerHTML='';(d.promocoes||[]).forEach(p=>adicionarPromo(p.titulo||'',p.detalhe||''));vazioPromo();
        el('listaEventos').innerHTML='';(d.eventos||[]).forEach(e2=>adicionarEvento(e2.titulo||'',e2.quando||'',e2.detalhe||''));vazioEvento();
        if(d.lat&&d.lng){coords={lat:d.lat,lng:d.lng};el('gpsInfo').innerHTML='📍 <b>Localização salva:</b><br>'+d.lat.toFixed(5)+', '+d.lng.toFixed(5);}
      }else{setStatus('fechado');vazioCat();vazioPromo();vazioEvento();}
    }catch(e){setStatus('fechado');vazioCat();vazioPromo();vazioEvento();}
  }

  onAuthStateChanged(auth,async(user)=>{
    usuarioAtual=user;
    if(user){
      el('formArea').style.display='none';el('painel').style.display='block';el('box').classList.add('largo');
      el('oExEmail').textContent=user.email;
      coords=null;slugSalvo='';el('linkPronto').classList.add('escondido');
      el('listaCategorias').innerHTML='';el('listaPromos').innerHTML='';el('listaEventos').innerHTML='';
      el('gpsInfo').innerHTML='📍 Localização ainda não definida.';
      abrirTab('perfil');
      await carregarDados(user.uid);
    }else{
      el('painel').style.display='none';el('formArea').style.display='block';el('box').classList.remove('largo');
      el('email').value='';el('senha').value='';el('btnAcao').disabled=false;trocarAba('entrar');
    }
  });
</script>
</body>
</html>
