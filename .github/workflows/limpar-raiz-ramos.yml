name: Limpeza da raiz - arquivos de ramo

# 29/09/2026 - roda UMA vez, sozinha, quando este arquivo sobe.
# Apaga da raiz os 40 live-<ramo>.jpg/.webp que foram para a pasta ramos/
# (pagina /aovivo marca 2026-09-29-clipes). Antes de apagar, confere:
#   1) cada arquivo tem o substituto dentro de ramos/;
#   2) NENHUMA pagina, script ou json do site ainda usa o arquivo.
# Se qualquer conferencia falhar, nao apaga nada e fica vermelho.
# Deu certo: apaga os 40 E este proprio arquivo, num commit so.
# live-moda.jpg/.webp NAO entram: a home e a /aovivo sem ramo usam.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpar-raiz-ramos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limpar-raiz-ramos
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir e apagar
        run: |
          set -e
          RAMOS="acai acessorios-celular autopecas bijuteria boutique brecho brinquedos calcados cama-mesa-banho confeitaria naturais perfumaria utilidades moda-masculina farmacia cosmeticos suplementos pet bebe esportes"
          grep -q "MOVIKI_VERSAO='2026-09-29-clipes'" aovivo.html || grep -q "ramos/'+r+'.mp4'" aovivo.html || { echo "PAROU: a aovivo.html no ar ainda nao e a versao com a pasta ramos/. Nada foi apagado."; exit 1; }
          APAGAR=""
          for k in $RAMOS; do
            for ext in jpg webp; do
              f="live-$k.$ext"
              [ -f "$f" ] || { echo "ja nao existe: $f"; continue; }
              if [ "$k" = "farmacia" ] || [ "$k" = "cosmeticos" ] || [ "$k" = "suplementos" ] || [ "$k" = "pet" ]; then
                [ -f "ramos/$k-tela.$ext" ] || { echo "PAROU: falta ramos/$k-tela.$ext. Nada foi apagado."; exit 1; }
              fi
              [ -f "ramos/$k.$ext" ] || { echo "PAROU: falta ramos/$k.$ext. Nada foi apagado."; exit 1; }
              USO=$(grep -rIl --exclude-dir=.git --exclude-dir=ramos --exclude-dir=.github --include='*.html' --include='*.js' --include='*.json' --include='*.css' --include='*.xml' --include='*.txt' -e "$f" . || true)
              if [ -n "$USO" ]; then echo "PAROU: $f ainda e usado em: $USO. Nada foi apagado."; exit 1; fi
              APAGAR="$APAGAR $f"
            done
          done
          [ -f live-moda.jpg ] && [ -f live-moda.webp ] || { echo "PAROU: live-moda sumiu da raiz. Nada foi apagado."; exit 1; }
          echo "Vai apagar:$APAGAR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -n "$APAGAR" ] && git rm -q $APAGAR
          git rm -q .github/workflows/limpar-raiz-ramos.yml
          git commit -q -m "Limpeza da raiz: live-<ramo> antigos (agora em ramos/) e o proprio limpador"
          git push
          echo "PRONTO: $(echo $APAGAR | wc -w) arquivos apagados da raiz. O limpador tambem se apagou."
