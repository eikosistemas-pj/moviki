/* /v/joao_silva -> joao_silva. Mesmo alfabeto do apelido do parceiro. */
function apelidoDaUrl(){
  const m = location.pathname.match(/\/v\/([^\/?#]+)/);
  let s = m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get('p') || '');
  s = String(s).toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,40);
  return s.length >= 3 ? s : '';
}
/* RAMO DO QR (12/10/2026): so viaja para o cadastro e para a live de exemplo
   do ramo. Nunca vira HTML: so [a-z0-9-], e so em href com encodeURIComponent. */
function ramoDaUrl(){
  let r = '';
  try{ r = new URLSearchParams(location.search).get('ramo') || ''; }catch(e){ r = ''; }
  r = String(r).toLowerCase().slice(0,40);
  try{ r = r.normalize('NFD').replace(/[̀-ͯ]/g,''); }catch(e){}
  r = r.replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
  return r.length >= 2 ? r : '';
}
function ramoDoCatalogo(r){
  try{ return (r && window.MOVIKI_RAMOS) ? window.MOVIKI_RAMOS.achar(r) : null; }catch(e){ return null; }
}
function esperarCatalogo(){
  return new Promise(res => {
    if(window.MOVIKI_RAMOS) return res();
    let n = 0;
    const iv = setInterval(() => { if(window.MOVIKI_RAMOS || ++n > 30){ clearInterval(iv); res(); } }, 50);
  });
}
function mesAno(iso){
  const m = /^(\d{4})-(\d{2})$/.exec(String(iso||''));
  if(!m) return '';
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return (meses[parseInt(m[2],10) - 1] || '') + ' de ' + m[1];
}
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  return ((p[0]||'P').charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}

/* ---------- PROVA DE VIDA: relogio e faixa holografica ---------- */
function ligarVida(){
  const rel = el('relogio'), dt = el('holoData');
  const fmtH = new Intl.DateTimeFormat('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'America/Sao_Paulo' });
  const fmtD = new Intl.DateTimeFormat('pt-BR', { weekday:'long', day:'2-digit', month:'long', timeZone:'America/Sao_Paulo' });
  function tic(){
    const agora = new Date();
    if(rel) rel.textContent = fmtH.format(agora);
    if(dt) dt.textContent = fmtD.format(agora) + ', horário de Brasília';
  }
  tic(); setInterval(tic, 1000);

  /* A faixa acompanha o dedo/mouse sobre o cracha e, onde o navegador deixa
     sem pedir permissao (Android), a inclinacao do celular. */
  const cracha = el('cracha');
  const holos = () => document.querySelectorAll('.holo');
  function brilho(frac){
    const v = Math.round((Math.max(0, Math.min(1, frac)) * 80 - 40)) + '%';
    holos().forEach(h => h.style.setProperty('--brilho', v));
  }
  cracha.addEventListener('pointermove', ev => { const r = cracha.getBoundingClientRect(); brilho((ev.clientX - r.left) / r.width); });
  cracha.addEventListener('touchmove', ev => { const t = ev.touches[0]; if(!t) return; const r = cracha.getBoundingClientRect(); brilho((t.clientX - r.left) / r.width); }, { passive:true });
  try{
    window.addEventListener('deviceorientation', ev => { if(typeof ev.gamma === 'number') brilho((ev.gamma + 30) / 60); });
  }catch(e){}
  /* sem movimento nenhum, a faixa respira sozinha devagar (devagar o bastante
     para nao incomodar; com "reduzir movimento" ligado, fica parada e quem
     prova a vida e so o relogio) */
  if(!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
    let t = 0; setInterval(() => { t += 0.05; brilho(0.5 + Math.sin(t) * 0.35); }, 120);
  }

  function virar(){ cracha.classList.toggle('virado'); cracha.setAttribute('aria-label', cracha.classList.contains('virado') ? 'Verso do crachá. Toque para ver a frente.' : 'Crachá do parceiro. Toque para ver o verso.');
    try{ if(window.mvEv) mvEv('cta_click', { cta:'cracha_virar', pagina:'verificacao' }); }catch(e){} }
  cracha.addEventListener('click', ev => { if(ev.target.closest && ev.target.closest('a')) return; virar(); });
  cracha.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); virar(); } });
}

/* QR desta pagina no verso: o parceiro mostra para o proximo comerciante. */
function desenharQR(apelido){
  const cv = el('qrVerso'); if(!cv) return;
  const tenta = (n) => {
    if(window.mvQR && window.mvQRDesenhar){
      const q = window.mvQR('https://moviki.com.br/v/' + apelido);
      if(q){ window.mvQRDesenhar(cv, q, 220, '#ffffff', '#0b1b30'); return; }
    }
    if(n < 40) setTimeout(() => tenta(n + 1), 100); else cv.style.display = 'none';
  };
  tenta(0);
}

/* MEDICAO DOS CTAs (03/09/2026): data-ev = nome do CTA, evento cta_click. */
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest ? e.target.closest('[data-ev]') : null;
  if(!a) return;
  try { if (window.mvEv) window.mvEv('cta_click', { cta: a.getAttribute('data-ev'), pagina: 'verificacao' }); } catch(err){}
});

(async function(){
  const apelido = apelidoDaUrl();
  try{ if(window.mvEv) mvEv('verificar_parceiro', { ref: apelido || 'sem_ref', ramo: ramoDaUrl() || 'sem_ramo' }); }catch(_){}
  if(!apelido){ pintarNegado('', false, false); mostrar(); return; }
  try{
    const snap = await getDoc(doc(db, 'parceiros_publicos', apelido));
    if(!snap.exists()){ pintarNegado(apelido, false, false); mostrar(); return; }
    const d = snap.data() || {};
    if(d.ativo !== true){ pintarNegado(apelido, true, false); mostrar(); return; }
    if(ramoDaUrl()) await esperarCatalogo();
    pintarAutorizado(d, apelido);
    mostrar();
  }catch(e){
    /* Rede caiu ou o Firestore nao respondeu. NAO dizemos "nao e parceiro":
       seria acusar alguem por um problema nosso. */
    pintarNegado(apelido, false, true);
    mostrar();
  }
})();
