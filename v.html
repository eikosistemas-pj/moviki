<style>
  /* CRACHA VIVO — 27/10/2026, pedido do Paulo: "dar vida de verdade ao cracha"
     e, na segunda rodada, "mais caprichado". O que faz dele um documento:
     - fundo de seguranca (linhas finas tipo cedula) e microtexto na borda;
     - selo holografico redondo que muda de cor com o dedo e com o celular;
     - o cracha inteiro inclina em 3D e o brilho corre pela superficie;
     - a conferencia ACONTECE na frente da pessoa: a luz passa de cima a baixo,
       o selo vira verde e o "Verificado agora" liga o relogio;
     - codigo do cracha (sai do apelido, sempre o mesmo) e QR na frente. */
  :root{
    --noite:#050b14; --noite2:#0a1628; --tinta:#0b1b30; --tinta2:#4a5d75; --tinta3:#7b8ca1;
    --perola:#f8fafc; --perola2:#e8edf4; --ciano:#00d4ff; --azul:#0066ff; --marinho:#0a2347;
    --ok:#12b76a; --okfundo:#e7f8ef; --alerta:#f79009; --perigo:#e5484d;
    --claro:#eaf3ff; --suave:#9fb2c6; --linha:rgba(0,212,255,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Poppins',system-ui,-apple-system,sans-serif;color:var(--claro);background:
      radial-gradient(900px 520px at 50% 18%,rgba(0,102,255,.20),transparent 70%),
      radial-gradient(600px 400px at 50% 110%,rgba(0,212,255,.08),transparent 70%),var(--noite);
    line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:540px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}

  .topo{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 0}
  .marca img{display:block;height:30px;width:auto}
  .topoTxt{font-size:12.5px;color:var(--suave)}

  /* ---------- cordao e presilha ---------- */
  .palco{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:4px}
  .cordao{width:30px;height:84px;position:relative;border-radius:0 0 5px 5px;
    background:
      repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),
      linear-gradient(90deg,#003c9e,#0a66ff 30%,#2f80ff 50%,#0a66ff 70%,#003c9e);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.4)}
  .cordao::before{content:'';position:absolute;left:3px;right:3px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.28);border-right:1px dashed rgba(255,255,255,.28)}
  .cordao span{position:absolute;left:50%;top:10px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:9.5px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.85)}
  .presilha{width:50px;height:26px;margin-top:-3px;border-radius:8px 8px 13px 13px;position:relative;z-index:2;
    background:linear-gradient(180deg,#f1f4f8,#b7c2cf 55%,#8995a5);box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 1px 0 #fff}
  .presilha::before{content:'';position:absolute;left:50%;top:7px;width:18px;height:5px;transform:translateX(-50%);border-radius:3px;background:#6d7888;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .presilha::after{content:'';position:absolute;left:50%;bottom:-11px;width:14px;height:16px;transform:translateX(-50%);border:3px solid #a3aebb;border-top:0;border-radius:0 0 9px 9px}

  /* ---------- cena 3D ---------- */
  .cena{perspective:1100px;width:min(100%,350px);margin-top:6px;touch-action:pan-y}
  .incl{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
  .cracha{position:relative;width:100%;aspect-ratio:54/86;transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.2,.7,.2,1);cursor:pointer;transform-origin:50% 0}
  .cracha.virado{transform:rotateY(180deg)}
  .cracha.chegou{animation:balanca 2.4s cubic-bezier(.3,.6,.2,1) 1}
  @keyframes balanca{0%{transform:translateY(-40px) rotate(-7deg);opacity:0}
    18%{opacity:1} 45%{transform:rotate(3.6deg)} 70%{transform:rotate(-1.6deg)} 100%{transform:rotate(0)}}
  .face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 40px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset}
  .frente{background:var(--perola);color:var(--tinta);display:flex;flex-direction:column}
  .verso{transform:rotateY(180deg);background:linear-gradient(170deg,#0e2546,#061328);color:var(--claro);padding:32px 22px 18px;display:flex;flex-direction:column}
  /* fundo de seguranca: linhas finas onduladas, como em cedula */
  .seg{position:absolute;inset:0;pointer-events:none;opacity:.55}
  .verso .seg{opacity:.28}
  /* brilho que corre pela superficie quando o cracha inclina */
  .brilho{position:absolute;inset:0;pointer-events:none;z-index:6;mix-blend-mode:soft-light;
    background:radial-gradient(420px 320px at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.42),rgba(255,255,255,0) 60%)}
  .furo{position:absolute;top:13px;left:50%;width:60px;height:12px;transform:translateX(-50%);border-radius:8px;
    background:var(--noite);box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.6);z-index:7}

  /* luz que confere: passa uma vez, de cima a baixo */
  .scan{position:absolute;left:0;right:0;top:-30%;height:30%;z-index:5;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(0,212,255,0),rgba(0,212,255,.28) 70%,rgba(0,212,255,.75) 96%,rgba(255,255,255,.95))}
  .cracha.conferindo .scan{animation:scan 1.15s cubic-bezier(.45,0,.3,1) .35s 1 forwards}
  @keyframes scan{0%{top:-30%;opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}

  .faixaTopo{position:relative;height:96px;flex:0 0 96px;overflow:hidden;
    background:linear-gradient(135deg,#071a36 0%,#0a2c5c 55%,#0057d9 100%);display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 13px}
  .faixaTopo .seg{opacity:.35}
  .faixaTopo .mk{position:relative;display:block}
  .faixaTopo .mk img{display:block;height:30px;width:auto}
  .faixaTopo .papel{position:relative;font-size:11.5px;font-weight:600;color:#cfe3ff;text-align:right;line-height:1.3}

  .corpo{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px;text-align:center}
  .fotoCaixa{position:relative;margin-top:-54px;z-index:2}
  .foto{width:116px;height:116px;border-radius:28px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a6cff,#00b8e6);color:#fff;font-weight:800;font-size:42px;letter-spacing:-.02em;
    border:5px solid var(--perola);box-shadow:0 0 0 1px rgba(11,27,48,.1),0 10px 24px rgba(11,27,48,.25);background-size:cover;background-position:center;overflow:hidden}
  .foto.temFoto{font-size:0;color:transparent}
  /* selo holografico */
  .holoSelo{position:absolute;right:-16px;bottom:-12px;width:50px;height:50px;border-radius:50%;
    background:conic-gradient(from var(--ang,0deg),#7ef0ff,#b9a6ff,#ffd38a,#9bffcb,#7ef0ff);
    box-shadow:0 0 0 3px var(--perola),0 6px 14px rgba(11,27,48,.28);display:flex;align-items:center;justify-content:center}
  .holoSelo::before{content:'';position:absolute;inset:5px;border-radius:50%;background:
    repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.35) 0 1px,transparent 1px 3px)}
  .holoSelo i{position:relative;width:30px;height:30px;border-radius:50%;background:#9aa7b6;display:flex;align-items:center;justify-content:center;
    transition:background .35s ease,transform .35s cubic-bezier(.3,1.6,.5,1)}
  .holoSelo i svg{width:16px;height:16px;color:#fff}
  .holoSelo i svg path{stroke-dasharray:28;stroke-dashoffset:28}
  .holoSelo .gira{position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--azul);animation:gira .8s linear infinite}
  .cracha.ok .holoSelo i{background:var(--ok);transform:scale(1.08)}
  .cracha.ok .holoSelo i svg path{transition:stroke-dashoffset .45s ease .1s;stroke-dashoffset:0}
  .cracha.ok .holoSelo .gira{display:none}
  .cracha.ok .holoSelo::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:onda .9s ease-out 1 forwards}
  @keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}

  .nome{margin-top:14px;font-size:22px;font-weight:800;line-height:1.18;letter-spacing:-.015em;word-break:break-word}
  .papel2{margin-top:3px;font-size:13px;font-weight:600;color:var(--azul)}
  .arroba{margin-top:5px;font-size:13px;color:var(--tinta2);font-weight:500}

  /* faixa holografica com o relogio */
  .holo{position:relative;margin:13px -20px 0;width:calc(100% + 40px);padding:10px 18px 9px;overflow:hidden;
    background:linear-gradient(110deg,#d9f7ff,#e9e0ff 30%,#dcffe9 55%,#fff1d6 78%,#d9f7ff);
    border-top:1px solid rgba(11,27,48,.08);border-bottom:1px solid rgba(11,27,48,.08)}
  .holo::before{content:'';position:absolute;inset:-40% -60%;background:
      linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 47%,rgba(255,255,255,0) 58%),
      repeating-linear-gradient(115deg,rgba(0,102,255,.07) 0 6px,rgba(168,85,247,.07) 6px 12px,rgba(18,183,106,.07) 12px 18px);
    transform:translateX(var(--brilho,-30%));pointer-events:none}
  .holoLinha{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vivo{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#3d4f66}
  .cracha.ok .vivo{color:#0a5c3a}
  .pulso{width:9px;height:9px;border-radius:50%;background:#9aa7b6}
  .cracha.ok .pulso{background:var(--ok);box-shadow:0 0 0 0 rgba(18,183,106,.55);animation:pulso 1.6s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 9px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
  .relogio{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--tinta);letter-spacing:.01em}
  .holoData{position:relative;margin-top:1px;font-size:11.5px;color:var(--tinta2);text-align:left}

  .dados{width:100%;margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;text-align:left}
  .dado .r{font-size:10.5px;color:var(--tinta3)}
  .dado .v{font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3;word-break:break-word;font-variant-numeric:tabular-nums}
  .credenciais{width:100%;margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
  .cred{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--okfundo);
    color:#0a6b42;font-size:11px;font-weight:700;border:1px solid rgba(18,183,106,.25)}
  .cred svg{width:12px;height:12px}
  .rodapeCartao{margin-top:auto;width:100%;padding:10px 0 12px;display:flex;align-items:center;gap:11px;border-top:1px solid rgba(11,27,48,.1);text-align:left}
  .qrMini{width:58px;height:58px;flex:0 0 58px;border-radius:8px;background:#fff;padding:3px;box-shadow:0 0 0 1px rgba(11,27,48,.1)}
  .rodTxt{flex:1;min-width:0;font-size:11px;color:var(--tinta2);line-height:1.45}
  .rodTxt b{display:block;color:var(--tinta);font-weight:700;font-size:11.5px;word-break:break-all}
  .virar{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--azul);margin-top:2px}
  .virar svg{width:13px;height:13px}
  /* microtexto na borda de baixo */
  .micro{position:absolute;left:0;right:0;bottom:0;height:9px;overflow:hidden;white-space:nowrap;font-size:5.5px;line-height:9px;font-weight:600;
    letter-spacing:.06em;color:rgba(10,35,71,.45);background:linear-gradient(90deg,#e8eef7,#f4f7fb);text-align:center}

  /* verso */
  .verso h3{position:relative;font-size:15.5px;font-weight:800;margin:4px 0 9px}
  .verso ul{position:relative;list-style:none;display:flex;flex-direction:column;gap:7px}
  .verso li{display:flex;gap:9px;font-size:13px;line-height:1.45;color:#d6e4f5}
  .verso li svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
  .verso .sim svg{color:#3ee08f} .verso .nao svg{color:#ff8a8f}
  .qrBox{position:relative;margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
  .qrBox canvas{width:84px;height:84px;background:#fff;border-radius:10px;padding:5px;flex:0 0 auto}
  .qrBox p{font-size:12px;color:#b9cbe0;line-height:1.45}
  .qrBox p b{color:#fff}
  .emissor{display:block;margin-top:6px;font-size:10px;color:#7f95b0;line-height:1.4}

  /* nao confirmado */
  .cracha.ruim .frente{filter:grayscale(.85)}
  .carimbo{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%) rotate(-14deg);padding:8px 16px;
    border:4px solid var(--perigo);border-radius:10px;color:var(--perigo);font-weight:800;font-size:22px;letter-spacing:.06em;
    background:rgba(255,255,255,.6);white-space:nowrap;z-index:8}
  .cracha.ruim .holoSelo{background:#c9d0da}

  /* ---------- abaixo do cracha ---------- */
  .dicaVivo{margin:20px auto 0;max-width:420px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--suave)}
  .dicaVivo svg{width:20px;height:20px;flex:0 0 auto;color:var(--ciano);margin-top:1px}
  .dicaVivo b{color:var(--claro);font-weight:600}

  .protecao{margin-top:22px;border-radius:18px;padding:18px;background:rgba(18,183,106,.07);border:1px solid rgba(18,183,106,.28)}
  .protecao h2{font-size:16px;font-weight:800;margin-bottom:6px;color:#bff5d9}
  .protecao p{font-size:14px;color:#cfe0f2;line-height:1.55}
  .protecao p+p{margin-top:8px}
  .protecao b{color:#fff;font-weight:600}

  .acoes{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 18px;border-radius:14px;
    background:linear-gradient(120deg,var(--ciano),var(--azul));color:#03111f;font-family:inherit;font-size:15.5px;font-weight:800;border:0;cursor:pointer;text-align:center}
  .btn.calmo{background:transparent;border:1px solid rgba(159,178,198,.35);color:var(--claro);font-weight:700}
  .btn:focus-visible,.cracha:focus-visible,.zap:focus-visible{outline:3px solid var(--ciano);outline-offset:3px}
  .letreiro{text-align:center;font-size:12.5px;color:var(--suave);margin-top:-2px}
  .letreiro b{color:var(--claro);font-weight:600}
  .zap{display:block;text-align:center;font-size:13px;color:var(--suave);margin-top:4px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(159,178,198,.35)}

  .porque{margin-top:26px;display:grid;gap:12px}
  .porque div{display:flex;gap:12px;align-items:flex-start}
  .porque .ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(0,212,255,.08);border:1px solid var(--linha);color:var(--ciano)}
  .porque .ic svg{width:19px;height:19px}
  .porque h3{font-size:14.5px;font-weight:700;line-height:1.35}
  .porque p{font-size:13.5px;color:var(--suave);line-height:1.5}

  .carregando{text-align:center;padding:90px 0 40px;color:var(--suave);font-size:14.5px}
  .spin{width:26px;height:26px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--ciano);border-radius:50%;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}

  .pe{margin-top:34px;text-align:center;font-size:12px;line-height:1.7;color:var(--suave)}
  .pe b{color:#c7d6ea;font-weight:600}
  .pe .links{margin-top:6px;display:flex;gap:5px 15px;justify-content:center;flex-wrap:wrap}
  .pe a{border-bottom:1px solid rgba(255,255,255,.14)}
  .escondido{display:none!important}
  @media (prefers-reduced-motion:reduce){
    .cracha.chegou{animation:none}.pulso,.spin,.holoSelo .gira{animation:none!important}.cracha,.incl{transition:none}
    .holo::before{transition:none}.cracha.conferindo .scan{animation:none}
  }
  @media (max-width:360px){.nome{font-size:20px}.foto{width:100px;height:100px}.dados{gap:7px}.qrMini{width:50px;height:50px;flex-basis:50px}}
</style>

/* MOVIKI v.html | versao 2026-10-27-logo

/* Fundo de seguranca: varias linhas senoidais finas, desenhadas em SVG.
   Cor e espessura mudam por face (frente clara, faixa e verso escuros). */
function fundoSeguranca(cor, linhas, alt){
  let p = '';
  for (let i = 0; i < linhas; i++){
    const y0 = (i / linhas) * alt, a = 5 + (i % 4) * 2, f = 0.018 + (i % 3) * 0.004;
    let d = 'M0 ' + y0.toFixed(1);
    for (let x = 6; x <= 360; x += 6) d += ' L' + x + ' ' + (y0 + Math.sin(x * f + i * 0.7) * a).toFixed(1);
    p += '<path d="' + d + '"/>';
  }
  return '<svg class="seg" viewBox="0 0 360 ' + alt + '" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="' + cor + '" stroke-width=".5">' + p + '</g></svg>';
}

/* /v/joao_silva -> joao_silva. Mesmo alfabeto do apelido do parceiro. */
function apelidoDaUrl(){
  const m = location.pathname.match(/\/v\/([^\/?#]+)/);
  let s = m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get('p') || '');
  s = String(s).toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,40);
  return s.length >= 3 ? s : '';
}
/* RAMO DO QR (12/10/2026): so viaja para o cadastro e para a live de exemplo
   do ramo. Nunca vira HTML: so [a-z0-9-], e so em href com encodeURIComponent. */
function ramoDaUrl(){
  let r = '';
  try{ r = new URLSearchParams(location.search).get('ramo') || ''; }catch(e){ r = ''; }
  r = String(r).toLowerCase().slice(0,40);
  try{ r = r.normalize('NFD').replace(/[̀-ͯ]/g,''); }catch(e){}
  r = r.replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
  return r.length >= 2 ? r : '';
}
function ramoDoCatalogo(r){

function mesAno(iso){
  const m = /^(\d{4})-(\d{2})$/.exec(String(iso||''));
  if(!m) return '';
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return (meses[parseInt(m[2],10) - 1] || '') + ' de ' + m[1];
}
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  return ((p[0]||'P').charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}
/* Codigo do cracha: FNV-1a do apelido, em base 32 sem letras que confundem. */
function codigoCracha(apelido){
  let h = 0x811c9dc5, h2 = 0x01000193;
  for (const c of apelido){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; h2 = Math.imul(h2 ^ c.charCodeAt(0), 2246822519) >>> 0; }
  const A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = '';
  for (let i = 0; i < 4; i++){ s += A[h & 31]; h >>>= 5; }
  s += '-';
  for (let i = 0; i < 4; i++){ s += A[h2 & 31]; h2 >>>= 5; }
  return 'MVK-' + s;
}

/* ---------- PROVA DE VIDA: relogio, inclinacao, brilho e selo ---------- */
function ligarVida(){
  const rel = el('relogio'), dt = el('holoData');
  const fmtH = new Intl.DateTimeFormat('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'America/Sao_Paulo' });
  const fmtD = new Intl.DateTimeFormat('pt-BR', { weekday:'long', day:'2-digit', month:'long', timeZone:'America/Sao_Paulo' });
  function tic(){
    const agora = new Date();
    if(rel) rel.textContent = fmtH.format(agora);
    if(dt) dt.textContent = fmtD.format(agora) + ', horário de Brasília';
  }
  tic(); setInterval(tic, 1000);

  const cena = el('cena'), incl = el('incl'), cracha = el('cracha');
  /* 27/10 (sem tremido): o celular do Paulo gravou o cracha tremendo. Causa:
     o giroscopio manda dezenas de leituras por segundo, com ruido, e a
     "respiracao" automatica brigava com ele a cada 120 ms — duas fontes
     empurrando o cracha para lugares diferentes. Agora existe UM alvo (dedo,
     giroscopio OU respiracao, nunca dois ao mesmo tempo) e o cracha desliza
     ate ele a cada quadro, com amortecimento. O giroscopio passa por filtro,
     zona morta e parte da posicao em que a pessoa segura o celular. */
  const alvo = { u:.5, v:.5 }, pos = { u:.5, v:.5 };
  let fonte = 'resp', ultimoToque = 0, giroBase = null, giroF = null, ultimoGiro = 0, t = 0, vis = true;
  const lim = x => Math.max(0, Math.min(1, x));
  function pinta(u, v){
    if (!REDUZ){
      incl.style.setProperty('--ry', ((u - .5) * 12).toFixed(2) + 'deg');
      incl.style.setProperty('--rx', ((.5 - v) * 9).toFixed(2) + 'deg');
    }
    document.querySelectorAll('.face').forEach(f => { f.style.setProperty('--gx', (u * 100).toFixed(1) + '%'); f.style.setProperty('--gy', (v * 100).toFixed(1) + '%'); });
    document.querySelectorAll('.holo').forEach(h => h.style.setProperty('--brilho', (u * 80 - 40).toFixed(1) + '%'));
    document.querySelectorAll('.holoSelo').forEach(x => x.style.setProperty('--ang', ((u * 220) + (v * 140)).toFixed(1) + 'deg'));
  }
  function quadro(){
    requestAnimationFrame(quadro);
    if (!vis || document.hidden) return;
    const agora = Date.now();
    if (fonte === 'dedo' && agora - ultimoToque > 1800) fonte = (agora - ultimoGiro < 1000) ? 'giro' : 'resp';
    if (fonte === 'giro' && agora - ultimoGiro > 1000) fonte = 'resp';
    if (fonte === 'resp' && !REDUZ){ t += 0.006; alvo.u = .5 + Math.sin(t) * .22; alvo.v = .5 + Math.cos(t * .7) * .12; }
    const k = fonte === 'dedo' ? .18 : .06;
    const du = alvo.u - pos.u, dv = alvo.v - pos.v;
    if (Math.abs(du) < .0008 && Math.abs(dv) < .0008) return;   /* parado: nao repinta */
    pos.u += du * k; pos.v += dv * k;
    pinta(pos.u, pos.v);
  }
  function pelo(x, y){
    const r = cena.getBoundingClientRect();
    fonte = 'dedo'; ultimoToque = Date.now();
    alvo.u = lim((x - r.left) / r.width); alvo.v = lim((y - r.top) / r.height);
  }
  cena.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse') pelo(ev.clientX, ev.clientY); });
  cena.addEventListener('touchmove', ev => { const tt = ev.touches[0]; if (tt) pelo(tt.clientX, tt.clientY); }, { passive:true });
  cena.addEventListener('pointerleave', () => { if (fonte === 'dedo'){ alvo.u = .5; alvo.v = .5; ultimoToque = 0; } });
  /* inclinacao do celular, onde o navegador deixa sem pedir permissao (Android) */
  try{
    window.addEventListener('deviceorientation', ev => {
      if (REDUZ || typeof ev.gamma !== 'number' || typeof ev.beta !== 'number') return;
      const g = { a: ev.gamma, b: ev.beta };
      if (!giroBase){ giroBase = g; giroF = { a: g.a, b: g.b }; return; }
      giroF.a += (g.a - giroF.a) * .12; giroF.b += (g.b - giroF.b) * .12;       /* filtro: tira o ruido */
      giroBase.a += (giroF.a - giroBase.a) * .004; giroBase.b += (giroF.b - giroBase.b) * .004;   /* a posicao de segurar vira o centro, devagar */
      let da = giroF.a - giroBase.a, db = giroF.b - giroBase.b;
      const morta = 1.5;                                                         /* zona morta: mao parada nao mexe nada */
      da = Math.abs(da) < morta ? 0 : da - Math.sign(da) * morta;
      db = Math.abs(db) < morta ? 0 : db - Math.sign(db) * morta;
      ultimoGiro = Date.now();
      if (fonte === 'dedo') return;
      fonte = 'giro';
      alvo.u = lim(.5 + da / 40); alvo.v = lim(.5 + db / 40);
    });
  }catch(e){}
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { vis = !!(es[0] && es[0].isIntersecting); }).observe(cena);
  if (REDUZ) pinta(.5, .5); else requestAnimationFrame(quadro);

  function virar(){ cracha.classList.toggle('virado'); cracha.setAttribute('aria-label', cracha.classList.contains('virado') ? 'Verso do crachá. Toque para ver a frente.' : 'Crachá do parceiro. Toque para ver o verso.');
    try{ if(window.mvEv) mvEv('cta_click', { cta:'cracha_virar', pagina:'verificacao' }); }catch(e){} }
  cracha.addEventListener('click', ev => { if(ev.target.closest && ev.target.closest('a')) return; virar(); });
  cracha.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); virar(); } });
}

      '<div><span class="ic">' + I.pix + '</span><span><h3>Seu dinheiro é só seu</h3><p>No Moviki não existe comissão por venda: o Pix das suas vendas cai na sua conta. Você paga só a mensalidade do plano, se quiser continuar depois do teste.</p></span></div>' +
    '</div>';

  /* FOTO (10/09/2026): 1) a que ele escolheu no painel (vem no espelho, sem
     ida a rede); 2) se nunca escolheu, a do Instagram (so com @ provado). */
  const fotoDele = d.foto;
  if(typeof fotoDele === 'string' && /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/.test(fotoDele)){
    const f = el('foto'); if(f){ f.style.backgroundImage = 'url("' + fotoDele + '")'; f.classList.add('temFoto'); }
  } else {
    const puro = arroba.replace(/^@+/,'');
    if(/^[a-z0-9._]{2,30}$/i.test(puro)){
      fetch(ROBO + '?instagram=' + encodeURIComponent(puro)).then(r => r.json()).then(j => {
        if(!j || !j.achou || typeof j.foto !== 'string' || !/^data:image\/(png|jpe?g|webp);base64,/.test(j.foto)) return;
        const f = el('foto'); if(!f) return; f.style.backgroundImage = 'url("' + j.foto + '")'; f.classList.add('temFoto');
      }).catch(()=>{});
    }
  }
  desenharQRs(apelido);
}

/* A conferencia ja aconteceu no banco; aqui ela e MOSTRADA: a luz passa e o
   selo fica verde. Sem movimento (reduzir movimento), fica verde na hora. */
function concluirConferencia(){
  const cr = el('cracha'), est = el('estado');
  const fim = () => { cr.classList.add('ok'); if (est) est.textContent = 'Verificado agora'; };
  if (REDUZ){ fim(); return; }
  cr.classList.add('conferindo');
  setTimeout(fim, 1450);
}

function pintarNegado(apelido, existe, falhaRede){
  const cr = el('cracha'); cr.classList.add('ruim');
  const titulo = falhaRede ? 'Não deu para conferir agora' : (existe ? 'Apelido não autorizado' : 'Apelido não encontrado');
  el('frente').innerHTML =
    fundoSeguranca('#c6ced8', 46, 560) +
    '<div class="furo"></div>' +
    '<div class="faixaTopo"><span class="mk"><img src="/logo.png" width="560" height="192" alt="Moviki"></span><span class="papel">Programa de<br>Parceiros</span></div>' +
    '<div class="carimbo">' + (falhaRede ? 'SEM CONEXÃO' : 'NÃO CONFIRMADO') + '</div>' +
    '<div class="corpo">' +
      '<div class="fotoCaixa"><div class="foto" style="background:#c9d0da">?</div></div>' +
      '<div class="nome">' + (apelido ? '/v/' + esc(apelido) : 'Sem apelido') + '</div>' +
      '<div class="papel2" style="color:#b54708">' + esc(titulo) + '</div>' +
      '<div class="holo"><div class="holoLinha"><span class="vivo"><span class="pulso" style="background:var(--alerta)"></span>Conferido agora</span><span class="relogio" id="relogio">--:--:--</span></div>' +
        '<div class="holoData" id="holoData">conferindo…</div></div>' +
      '<div class="rodapeCartao"><div class="rodTxt">Confira sempre por<b>moviki.com.br/v/apelido</b><span class="virar">' + I.virar + 'Toque para ver o verso</span></div></div>' +
    '</div>' + microtexto() + '<div class="brilho"></div>';
  el('verso').innerHTML = montarVerso(apelido || '', '');
  el('dicaVivo').innerHTML = I.olho + '<span>' + (falhaRede
    ? '<b>Isto é um problema de conexão, não uma resposta sobre a pessoa.</b> Recarregue a página ou fale com a gente.'
    : '<b>Não conte isto como confirmação.</b> Pode ser só o apelido digitado errado, mas peça à pessoa o link do crachá dela ou fale direto com o Moviki.') + '</span>';
  /* NAO se vende nesta tela: quem chegou aqui pode estar diante de alguem se
     passando por parceiro. Sem ref, de proposito. */
  const utmN = 'utm_source=parceiro&utm_medium=verificacao_negada&utm_campaign=programa_parceiros';
  el('depois').innerHTML =
    '<div class="protecao" style="background:rgba(247,144,9,.07);border-color:rgba(247,144,9,.35)"><h2 style="color:#ffd8a8">Em nome do Moviki, ninguém cobra nada de você</h2>' +
      '<p>Se alguém pedir pagamento, taxa de cadastro ou dados do banco dizendo ser do Moviki, <b>não pague e fale com a gente</b>.</p></div>' +
    '<div class="acoes">' +
      '<a class="btn" data-ev="' + (falhaRede ? 'verificar_zap_falha' : 'verificar_zap_negado') + '" href="https://wa.me/554120186848?text=' +
        encodeURIComponent(falhaRede ? 'Olá! Não consegui conferir um parceiro do Moviki agora.' : ('Olá! Alguém disse ser parceiro do Moviki com o apelido "' + apelido + '" e eu não consegui confirmar.')) +
        '" target="_blank" rel="noopener">Falar com o Moviki</a>' +
      (falhaRede ? '<button class="btn calmo" type="button" onclick="location.reload()">Tentar de novo</button>'
                 : '<a class="btn calmo" data-ev="verificar_conhecer_negado" href="/comerciantes.html?' + utmN + '">Conhecer o Moviki</a>') +
    '</div>';
}

function mostrar(ok){
  el('carregando').classList.add('escondido');
  el('conteudo').classList.remove('escondido');
  ligarVida();
  const cr = el('cracha');
  if(!REDUZ){ cr.classList.add('chegou'); setTimeout(() => cr.classList.remove('chegou'), 2500); }
  if (ok) concluirConferencia();
}

/* MEDICAO DOS CTAs (03/09/2026): data-ev = nome do CTA, evento cta_click. */
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest ? e.target.closest('[data-ev]') : null;
  if(!a) return;
  try { if (window.mvEv) window.mvEv('cta_click', { cta: a.getAttribute('data-ev'), pagina: 'verificacao' }); } catch(err){}
});

(async function(){
  const apelido = apelidoDaUrl();
  try{ if(window.mvEv) mvEv('verificar_parceiro', { ref: apelido || 'sem_ref', ramo: ramoDaUrl() || 'sem_ramo' }); }catch(_){}
  if(!apelido){ pintarNegado('', false, false); mostrar(false); return; }
  try{
    const snap = await getDoc(doc(db, 'parceiros_publicos', apelido));
    if(!snap.exists()){ pintarNegado(apelido, false, false); mostrar(false); return; }
    const d = snap.data() || {};
    if(d.ativo !== true){ pintarNegado(apelido, true, false); mostrar(false); return; }
    if(ramoDaUrl()) await esperarCatalogo();
    pintarAutorizado(d, apelido);
    mostrar(true);
  }catch(e){
    /* Rede caiu ou o Firestore nao respondeu. NAO dizemos "nao e parceiro":
       seria acusar alguem por um problema nosso. */
    pintarNegado(apelido, false, true);
    mostrar(false);
  }
})();
</script>
