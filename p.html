<!-- 16/09/2026 — ESTA PAGINA E O LINK MAIS COMPARTILHADO DO PROJETO, e ate
     hoje ela nao tinha uma unica metatag de previa. Quem recebia o link do
     parceiro no WhatsApp via um cartao com a palavra "Moviki" e o dominio,
     sem imagem e sem uma linha explicando o que era. Peca de live no post,
     cartao mudo no link.
     O redirecionamento e por JavaScript; o robo de previa do WhatsApp e do
     Facebook le o HTML ANTES de rodar script, entao estas linhas funcionam
     mesmo com a pagina redirecionando na hora.
     O texto fala com o LOJISTA, que e quem recebe a indicacao — nao com o
     parceiro. E acompanha o destino: a `comerciantes.html`. Mudou la, muda
     aqui. -->
<meta name="description" content="Seu negócio no mapa em tempo real e ao vivo pela câmera do celular. Cardápio, promoções e um link só seu. 30 dias grátis, sem cartão e sem comissão por venda.">

<meta property="og:description" content="Mostre o que você vende pela câmera do celular e apareça para quem está perto agora. 30 dias grátis, sem cartão e sem comissão por venda.">

<script>
/* MOVIKI p.html | versao 2026-09-16-previa | redirecionador do link de parceiro /p/apelido
   NAO carrega Google Analytics de proposito: a pagina redireciona na hora e o GA nao
   teria tempo de enviar nada. Em vez disso, ela CARIMBA o destino com UTM — assim o
   comerciantes.html mede a visita ja sabendo que ela veio de indicacao, e de quem. */
(function(){
  var m=location.pathname.match(/\/p\/([^\/?#]+)/);
  var ref=(m?decodeURIComponent(m[1]):'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);
  var q='utm_source=parceiro&utm_medium=indicacao&utm_campaign=programa_parceiros'
      +'&utm_content='+encodeURIComponent(ref.length>=3?ref:'sem_ref');
  if(ref.length>=3){
    q+='&ref='+encodeURIComponent(ref);
    /* COOKIE DE INDICACAO — 04/09/2026.
       O ?ref viajava so na URL: bastava o comerciante ler a landing, fechar a
       aba e voltar depois pelo Google para a indicacao do parceiro morrer no
       caminho. O cookie e gravado no dominio PAI (.moviki.com.br), entao o
       app.moviki.com.br, que e outro dominio para o localStorage, enxerga o
       mesmo valor. 90 dias, first-party, so o apelido do parceiro — nada de
       publicidade e nada de terceiro. */
    try{ document.cookie='mv_ref='+encodeURIComponent(ref)+
      '; Max-Age=7776000; Path=/; Domain=.moviki.com.br; SameSite=Lax; Secure'; }catch(e){}
  }
  location.replace('/comerciantes.html?'+q);
})();
</script>
